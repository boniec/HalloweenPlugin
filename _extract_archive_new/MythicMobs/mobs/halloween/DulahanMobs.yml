DulahanChest:
  Type: zombie
  Display: '&6Dulahan Chest'
  Health: 500
  Damage: 0
  ShowHealth: true
  Despawn: true
  Options:
    LockPitch: true
    KnockbackResistance: 1
    PreventOtherDrops: true
    ApplyInvisibility: true
    Silent: true
    FollowRange: 32
    MaxCombatDistance: 64
    MovementSpeed: 0.35
    PreventMobKillDrops: true
    PreventItemPickup: true
    PreventSunburn: true
  Modules:
    ImmunityTable: true
    ThreatTable: true
  DamageModifiers:
  - MAGIC 0.1
  - SUFFOCATION 0
  Faction: Dulahan 
  BossBar:
    Enabled: true
    Title: '&1Dulahan Chest'
    Range: 10
    Color: GOLD
    Style: SOLID
  AIGoalSelectors:
  - 0 Clear
  AITargetSelectors:
  - 0 clear
  Skills:     
  - cancelevent{sync=true} @Self ~onAttack
  - model{mid=dulahan_chest;n=false;damagetint=false;i=true} @self ~onSpawn 
  - bodyclamp{m=dulahan_chest;c=0} @self ~onSpawn
  #
  - Aura{auraName=IdleAura;onTick=DulahanChestIdle;interval=1;duration=20000} @self ~onSpawn
  - skill{s=DulahanChestOpen} @Self ~onInteract 1
  #
  - potion{type=DAMAGE_RESISTANCE;duration=999999;lvl=10;hasParticles=false} @self ~onSpawn 1
  LevelModifiers:
     Health: 0.0
