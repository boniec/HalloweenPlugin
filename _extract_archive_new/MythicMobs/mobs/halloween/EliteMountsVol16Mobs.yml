EliteMountVol16Watcher:
  Type: zombie
  Display: '&5Watcher'
  Health: 50
  Options:
    Silent: true
    ApplyInvisibility: true
    Despawn: true
    ShowHealth: true
    KnockbackResistance: 1
    PreventOtherDrops: true
    MovementSpeed: 0.15
    PreventSunburn: true
    FollowRange: 0
  Faction: Mounts
  DamageModifiers:
  - FALL 0
  - PROJECTILE 0
  - ENTITY_ATTACK 0
  - CONTACT 0
  - SUFFOCATION 0
  - MAGIC 0
  - WITHER 0
  - DROWNING 0
  - MELTING 0
  - ENTITY_SWEEP_ATTACK 0
  - FIRE 0
  - FIRE_TICK 0
  - POISON 0
  - THORNS 0
  - SONIC_BOOM 0
  - BLOCK_EXPLOSION 0
  BossBar:
    Enabled: true
    Title: '&6Watcher'
    Range: 6
    Color: BLUE
    Style: SOLID
  AIGoalSelectors:
  - 0 Clear
  - 1 gotoowner 10
  AITargetSelectors: 
  - 0 clear
  Skills:    
  - cancelevent{sync=true} @Self ~onAttack     
  - model{mid=ecwatcher;n=false;damagetint=false;i=true;mount=true;drive=true;ride=true;step=1} @self ~onSpawn
  - bodyclamp{m=ecwatcher;c=50} @self ~onSpawn
  - Aura{auraName=EliteMountVol16WatcherMechanicsAura;onTick=EliteMountVol16WatcherMechanics;interval=1;duration=999999} @self ~onSpawn
  - skill{s=EliteMountVol16WatcherAbility} @Self ~onSignal:ABILITY
  - skill{s=EliteMountVol16WatcherMount} @trigger ~onInteract
  - skill{s=EliteMountVol16WatcherPetting} @Self ~onInteract
  - summon{type=EliteMountVol16WatcherDeath;amount=1;radius=0;summonerIsOwner=true} @SelfLocation ~onDeath 1
  - sound{s=ecmounts:custom.ecmounts.summon;v=1;p=1;sc=WEATHER} @Self ~onSpawn
  - remove @self ~onDeath 1
EliteMountVol16WatcherDeath:
  Type: DROWNED
  Display: ''
  Health: 100
  Damage: 0
  ShowHealth: true
  Despawn: true
  Options:
    PreventOtherDrops: true
    ApplyInvisibility: true
    Silent: true
    PreventMobKillDrops: true
    PreventItemPickup: true
    MovementSpeed: 0.0
    PreventSunburn: true
    KnockbackResistance: 1
  Faction: body
  Modules:
    ThreatTable: false
  AIGoalSelectors:
  - 0 clear
  AITargetSelectors:
  - 0 clear
  Skills:
  - model{mid=ecwatcher;n=false;damagetint=false;i=true} @self ~onSpawn 
  - potion{type=SLOW;duration=20;level=5;hasParticles=false} @self ~onSpawn 1 
  - skill{s=EliteMountVol16WatcherDeath} @Self ~onSpawn 1 
  - remove @self ~onDeath 1
