DulahanDrop:
  Cooldown: 30 
  Skills:
  - dropitem{i=DulahanHead} @SelfLocation 0.5
  - delay 10
  - dropitem{i=DulahanAxe} @SelfLocation 0.5
  - delay 40
  - remove @self
######################################  
#Dulahan Chest  
######################################
DulahanChestIdle:
  Conditions:
  - hasaura idle false
  - hasaura Open false
  Skills:
  - Aura{auraName=idle;interval=1;duration=20} @self
  - state{mid=dulahan_chest;s=waiting;li=0;lo=0;r=false} @self
  - effect:particlesphere{particle=end_rod;amount=1;radius=1.5;vd=64;y=0.3;repeat=20;repeatInterval=1} @self
DulahanChestOpen:
  Cooldown: 200
  TriggerConditions:
  - hasitem{i=DulahanKey;amount=>0} true
  Skills:  
  - takeitem{i=DulahanKey;a=1} @trigger
  - Aura{auraName=Open;interval=1;duration=200} @self
  - state{mid=dulahan_chest;s=openchest;li=0;lo=0;r=false} @self
  - effect:particlering{particle=crit;radius=0.7;points=32;amount=1;hS=0;vS=0;repeat=100;repeatInterval=2} @Forward{f=0;y=0.2}
  - delay 20
  - state{mid=dulahan_chest;s=openwaiting;li=0;lo=0;r=false;repeat=20;repeatInterval=10} @self
  - effect:particlesphere{particle=crit;amount=1;radius=0.9;vd=64;y=1.2;repeat=20;repeatInterval=1} @self 
  - dropitem{i=DulahanHead} @Forward{f=-1;y=5;sideOffset=-0.5} 0.7
  - delay 20
  - effect:particlesphere{particle=crit;amount=1;radius=0.9;vd=64;y=1.2;repeat=20;repeatInterval=1} @self 
  - dropitem{i=DulahanAxe} @Forward{f=-1;y=5;sideOffset=-0.5} 0.7
  - delay 100
  - remove @self
######################################
DulahanThreat:
  Cooldown: 0.5
  Conditions:
  - hasaura Charge false
  Skills: 
  - threat{amount=1} @LivingEntitiesInRadius{r=50;ignore=samefaction;sort=NEAREST;limit=2} 
  - delay 1
  - threat{amount=20} @LivingEntitiesInRadius{r=50;ignore=samefaction;sort=RANDOM;limit=2} 0.5
