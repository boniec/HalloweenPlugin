# Co sie dzieje po kliknieciu PPM w NPC.
# Zmien linie "command{...}" na swoja komende (bez ukosnika).
#   asTarget=true  -> komende wykonuje GRACZ ktory kliknal
#   (bez asTarget) -> komende wykonuje KONSOLA; <target.name> = nick gracza
# Cudzyslow " w komendzie jest zabroniony. Przyklady:
#   - command{c="mistrzzadan";asTarget=true} @trigger
#   - command{c="give <target.name> diamond 1"} @trigger

hm5_click_king:
  Cooldown: 2
  Skills:
  - message{m="<&e>Krol: <&f>Witaj, <target.name>!"} @trigger
  - command{c="spawn";asTarget=true} @trigger

