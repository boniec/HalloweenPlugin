npc_enderman_hunter:
  Type: DROWNED
  Display: "Enderman Hunter"
  Health: 20
  AIGoalSelectors:
    - 0 clear
    - 1 lookatplayers{range=7}
  AITargetSelectors:
    - 0 clear
  Options:
    Despawn: false
    MovementSpeed: 0
    Collidable: false
    Silent: true
  Skills:
    - model{mid=npc_enderman_hunter;n=false} @self ~onSpawn
    - model{mid=npc_enderman_hunter;n=false} @self ~onLoad
    - skill{s=beyond_click_enderman_hunter} @trigger ~onInteract
    - setstance{stance=idling} @Self ~onSpawn
    - CancelEvent ~onDamaged


