am_goblin_boss:
  Display: am_goblin_boss
  Type: HUSK
  BossBar:
    Enabled: false
    Title: 'Goblin Boss'
    Range: 50
    Color: RED
    Style: SOLID
    CreateFog: true
    DarkenSky: true
  Health: 1024
  Damage: 0
  Faction: gobbos
  Options:
    Silent: true
    MovementSpeed: 0.22
    PreventSunburn: true
    PreventJockeyMounts: true
    KnockbackResistance: 0.75
    Collidable: true
    PreventOtherDrops: true
  Skills:
  - model{mid=am_goblin_boss} @self ~onSpawn
  - brightness{b=10;s=10} @self ~onSpawn

  # nonfrenzy state atks
  - randomskill{s=am_gboss_atk1,am_gboss_atk2,am_gboss_atk3,am_gboss_atk4,am_gboss_atk5} @self ~onTimer:20
  # frenzy state atks
  - randomskill{s=am_gboss_atk11,am_gboss_atk22,am_gboss_atk33,am_gboss_atk44} @self ~onTimer:20

  # armor break
  - skill{s=am_gboss_armorbreak1} =1%-90% ~onDamaged @self # leftarm & knee
  - skill{s=am_gboss_armorbreak2} =1%-75% ~onDamaged @self # rightarm & hip
  - skill{s=am_gboss_armorbreak3} =1%-50% ~onDamaged @self # torso
  - addtag{t=under90} @self ~onSpawnOrLoad
  - addtag{t=nonfrenzy} @self ~onSpawnOrLoad
  - partvis{m=am_goblin_boss;p=frenzy_eye} @self ~onSpawnOrLoad
  - particles{p=dust_color_transition;color1=#F05455;color2=#5B0C2A;amount=2;hS=0.05;vS=0.05;y=0;size=1} =1%-50% @modelpart{pid=left_eye} ~onTimer:1
  - particles{p=dust_color_transition;color1=#F05455;color2=#5B0C2A;amount=2;hS=0.05;vS=0.05;y=0;size=1} =1%-50% @modelpart{pid=right_eye} ~onTimer:1

  #sounds
  - sound{s=minecraft:entity.strider.happy;v=2;p=0.5} @selflocation ~onTimer:205
  - sound{s=minecraft:entity.strider.death;v=2;p=0.6} @selflocation ~onDeath
  - sound{s=minecraft:entity.strider.hurt;v=1.5;p=0.6} @selflocation ~onDamaged
  - sound{s=minecraft:entity.blaze.hurt;v=1;p=0.6} =50%-101% @selflocation ~onDamaged