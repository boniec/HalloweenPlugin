Zeus-Melee:
  Skills:
  - cancelevent
  - randomskill{s=Zeus-Zap,Zeus-Bash,Zeus-Bolt,Zeus-Knockback} @self

Zeus-Bash:
  Cooldown: 3.0 
  Conditions:
  - stance land
  - offgcd
  Skills:
  - gcd{ticks=30}
  - state{s=rebuke;li=3;lo=2} @self
  - delay 8
  - sound{s=entity.player.attack.sweep;p=0.75;v=2} @self
  - delay 12
  - totem{ch=3;onStart=[
      - sound{s=item.trident.hit;p=0.5}
      - sound{s=entity.player.attack.crit;p=0.5;v=2}
      - damage{amount=18} @PlayersNearOrigin{r=5}
      - effect:particles{particle=cloud;amount=45;hS=.25;vS=1} @PlayersNearOrigin{r=2}
    ];int=1;hR=3;md=1} @Forward{f=1.5}
  - delay 8
  - state{s=rebuke;remove=true} @self  
    
Zeus-Knockback:
  Cooldown: 3.0 
  Conditions:
  - stance land
  - offgcd
  Skills:
  - gcd{ticks=30}
  - state{s=knock;li=3;lo=2} @self
  - delay 8
  - sound{s=entity.player.attack.knockback;p=0.5;v=2} @self
  - totem{ch=3;onStart=[
      - sound{s=item.trident.hit;p=0.5}
      - sound{s=entity.player.attack.crit;p=0.5;v=2}
      - damage{amount=16} @PlayersNearOrigin{r=5}
      - throw{v=20;vy=8} @PlayersNearOrigin{r=5}
      - effect:particles{particle=cloud;amount=45;hS=.25;vS=1} @PlayersNearOrigin{r=2}
    ];int=1;hR=3;md=1} @Forward{f=1.5}
  - delay 15
  - state{s=knock;remove=true} @self  
    
Zeus-Zap:
  Cooldown: 6
  Conditions:
  - stance land
  - offgcd
  Skills:
  - gcd{ticks=20}
  - state{s=zap;li=3;lo=2} @self
  - delay 20
  - skill{origin=@ModelPart{m=mso_zeus;p=jolt};skill=[
      - particleline{p=spark;s=0;y=0;fromOrigin=true;zz=true;db=1;zzo=1}
      - sound{s=item.trident.thunder;p=1.25;v=1}
      - lightning
      - damage{amount=8}
      - damage{amount=2;ia=true}
    ]} @target
  - delay 5
  - state{s=zap;remove=true} @self  
  
Zeus-Bolt:
  Cooldown: 14
  Conditions:
  - stance land
  - offgcd
  Skills:
  - gcd{ticks=20}
  - state{s=toss_bolt;li=3;lo=2} @self
  - delay 20
  - skill{origin=@ModelPart{m=mso_zeus;p=jolt};skill=[
      - particleline{p=spark;s=0;y=0;fromOrigin=true;zz=true;db=1;zzo=1}
      - sound{s=item.trident.thunder;p=1.25;v=1}
      - lightning
      - damage{amount=15}
    ]} @target
  - delay 20
  - state{s=toss_bolt;remove=true} @self
  
Zeus-Lightning:
  Cooldown: 5.0
  TargetConditions:
  - distance <20
  Conditions:
  - offgcd
  - incombat
  Skills:
  - gcd{ticks=20}
  - potion{type=SLOW;level=10;d=40} @self
  - state{s=summon_lightning;li=3;lo=2} @self
  - sound{s=entity.evoker.prepare_attack;p=1.6;v=1.5} @self
  - delay 20
  - skill{s=[
      - chain{repeat=10;repeati=1;bounces=10;fromOrigin=true;
            origin=@ModelPart{m=zeus;p=jolt};
            onBounce=[
              - particle{p=flash;s=5} @origin
              - particleline{p=magicCrit;s=0.1;y=1;fromOrigin=true}
              - sound{s=item.trident.thunder;p=2;v=0.5}
            ]} @target
    ]}
  - damage{amount=14;repeat=1;repeati=10}
  - delay 20
  - effect:lightning{localized=true}

Zeus-SummonBallLightning:
  Cooldown: 60.0
  Conditions:
  - incombat
  Skills:
  - summon{type=ZeusBallLightning} @Ring{points=8;radius=16;y=20}
      
Zeus-LightningShockwave: 
  Cooldown: 18
  Conditions:
  - offgcd
  - incombat
  Skills:
  - gcd{ticks=50} @self
  - setai{ai=false} @self
  - state{s=shockwave} @self
  - delay 18
  - projectile{v=30;i=1;se=false;sb=false;mr=10;
      onTick=[
        - summon{type=ZeusLightningField}
        - particleline{p=spark;s=0;y=0;db=1;y=-5}
      ]} @targetlocation{y=1}
  - projectile{v=30;i=1;se=false;sb=false;mr=10;ho=20;
      onTick=[
        - summon{type=ZeusLightningField}
        - particleline{p=spark;s=0;y=0;db=1;y=-5}
      ]} @targetlocation{y=1}
  - projectile{v=30;i=1;se=false;sb=false;mr=10;ho=-20;
      onTick=[
        - summon{type=ZeusLightningField}
        - particleline{p=spark;s=0;y=0;db=1;y=-5}
      ]} @targetlocation{y=1}
  - delay 12
  - setai{ai=true} @self
      
Zeus-Death:
  Skills:
  - lightning{repeat=20;repeati=5}
  - pull{v=5;repeat=140} @children
  - delay 20
  - lightning{repeat=20;repeati=5}
  - delay 20
  - lightning{repeat=50;repeati=2}
  - delay 100
  - remove @children
  - lightning{repeat=50;repeati=1}

