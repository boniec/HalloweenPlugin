MSO_Zeus:
  Type: HUSK
  Display: '&4&lZeus, God of the Sky'
  Health: 2000
  BossBar:
    Enabled: false
    Title: "&r☠  &4&lZeus, God of the Sky  &r☠"
    Color: RED
    Range: 100
    Style: SEGEMENTED_20
  Options:
    Tameable: true
    Silent: true
    MovementSpeed: 0.34
  ThreatTable:
    Enabled: true
  DamageModifiers:
  - LIGHTNING 0
  Skills: 
  - potion{type=FIRE_RESISTANCE;d=100000;l=1} @Self ~onSpawn
  - model{mid=mso_zeus;n=false} @self ~onSpawn
  - velocity{x=0;y=0;z=0;delay=1} @self ~onDamaged
  - skill{s=[
      - setai{ai=false}
      - setstance{stance=sitting} 
      - delay 20
      - defaultstate{mid=mso_zeus;type=IDLE;state=idle}
      - delay 20
      - defaultstate{mid=mso_zeus;type=WALK;state=walk}
      - delay 20
      - setstance{stance=land} 
      - setai{ai=true}
    ]} @self ~onSpawn
  - skill:Zeus-Melee{sync=true} @trigger ~onAttack
  - skill:Zeus-SummonBallLightning @self ~onTimer:20 <30%
  - skill:Zeus-Death @self ~onDeath
    
    
    
    
    
    
    
    
    
ZeusLightningField:
  Type: ARMOR_STAND
  Disguise: Area_Effect_Cloud setParticle SPELL_MOB setColor AQUA
  Options:
    Invincible: true
  Skills:
  - skill{s=[
      - damage{amount=5}
      - sound{s=entity.lightning_bolt.thunder;p=2}
    ]} @PIR{r=3} ~onTimer:20
  - remove{delay=1200} @self ~onSpawn
  - lightning @self ~onSpawn
  
ZeusTornado:
  Type: HUSK
  Display: 'Tornado'
  Health: 400 
  Options:
    Tameable: true
    Invincible: true
  ThreatTable:
    Enabled: true
  Skills:
  - model{mid=mso_tornado;n=false} @self ~onSpawn
  - remove{delay=1200} @self ~onSpawn
  - spin{d=99999;v=30} @self ~onSpawn
  - throw{v=8;vy=15} @PIR{r=2} ~onTimer:10
  - sound{s=entity.wither.ambient;p=2;v=0.1} @self ~onTimer:4
  - particles{p=cloud;a=5;s=0.1} @self ~onTimer:4
  
ZeusBallLightning:
  Type: CREEPER
  Display: '&cBall Lightning'
  Disguise: CREEPER setPowered setInvisible
  Damage: 5
  DamageModifiers:
  - FALL 0
  Options:
    MovementSpeed: 0.4
  Skills:
  - throw{v=15;vy=20} @PIR{r=4} ~onExplode
    
ZeusLightning:
  Type: ARMOR_STAND
  Display: "&b"
  Options:
    Invisible: true
    AlwaysShowName: true
    CanTick: false
    HasGravity: false
    ItemHand: FakeTorch
    Interactable: false
  Skills:
    - remove{delay=6} @self ~onSpawn
    - randomskill{skills=[ - setname{name="&b"} ],[ - setname{name="&b"} ],[ - setname{name="&b"} ]} @self ~onTimer:1