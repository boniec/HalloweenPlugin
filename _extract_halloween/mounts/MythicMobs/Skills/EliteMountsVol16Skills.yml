EliteMountVol16WatcherRemove30min:
  Cooldown: 0
  Conditions:
  Skills:
  - delay 34800
  - message{m="&41 &fmin to despawn your pet"} @owner
  - delay 600
  - message{m="&430 &fsec to despawn your pet"} @owner
  - delay 500
  - message{m="&45 &fsec to despawn your pet"} @owner
  - delay 100
  - remove @self
EliteMountVol16WatcherMechanics:
  Cooldown: 0
  Conditions:
  Skills:
  - skill{s=EliteMountVol16WatcherColision} @self
  - skill{s=EliteMountVol16WatcherCheckers} @self
EliteMountVol16WatcherColision:
  Cooldown: 0.0
  Conditions:
  Skills:
  - throw{velocity=1;velocityY=0} @LivingEntitiesInRadius{r=1.5;ignore=samefaction}
EliteMountVol16WatcherDeath:
  Skills:
  - skill{s=EliteMountVol16WatcherDeathSound} @self
  - state{mid=ecwatcher;s=death;li=0;lo=0;r=false} @self
  - delay 20
  - state{mid=ecwatcher;s=body;li=0;lo=0;r=false;repeat=50;repeatInterval=10} @self
  - velocity{m=set;x=0;y=0;z=0;repeat=10;repeatInterval=20} @self 
  - delay 200
  - remove @self
EliteMountVol16WatcherDespawn:
  Skills:
  - sound{s=ecmounts:custom.ecmounts.revoke;v=1;p=1;sc=MASTER} @Self
  - delay 20
  - remove @self
EliteMountVol16WatcherMount:
  Cooldown: 1
  TriggerConditions:
  - owner{} true
  - crouching false
  Conditions:
  - moving{} false
  Skills:
  - mountmodel{mid=ecwatcher;mount=true;drive=true;ride=true;dmg=false;f=true;mode=Flying} @trigger
EliteMountVol16WatcherAbility:
  Cooldown: 10
  TriggerConditions:
  Conditions:
  - moving{} true
  - hasaura{n=Petting} false
  Skills:
  - sound{s=ecmountshallow:custom.ecmountshallow.dragonability;v=1;p=1;sc=NEUTRAL} @Self
  - skill{s=EliteMountVol16WatcherAbilitySkill;repeat=4;repeatInterval=20} @self
EliteMountVol16WatcherAbilitySkill:
  Cooldown: 0
  Conditions:
  - moving{} true
  Skills:
  - effect:particles{p=end_rod;amount=10;speed=0.1;hS=0.3;vS=0.3;y=1;repeat=10;repeatInterval=2} @self 1.0
  - potion{type=SPEED;duration=20;level=2;hasParticles=false} @self 
  - Aura{auraName=Ability;interval=1;duration=20} @self
  - state{mid=ecwatcher;s=sprint;li=0;lo=0;r=false} @self
  - sound{s=ecmountshallow:custom.ecmountshallow.dragonsprint;v=1;p=1;sc=BLOCKS} @Self
EliteMountVol16WatcherPetting:
  Cooldown: 1
  TriggerConditions:
  - owner{} true
  - crouching true
  Conditions:
  - hasaura{n=Ability} false
  - hasaura{n=Petting} false
  Skills:
  - sound{s=ecmountshallow:custom.ecmountshallow.dragonpet;v=1;p=1;sc=AMBIENT} @Self
  - Aura{auraName=Petting;interval=1;duration=80} @self
  - state{mid=ecwatcher;s=petting;li=5;lo=10;r=false} @self
EliteMountVol16WatcherCheckers:
  Cooldown: 0
  Conditions:
  Skills:
  - skill{s=EliteMountVol16WatcherWalkingSound} @self



