# =========================================================
#  Konfiguracja systemu Antylogout (tag walki / combat-log)
#  Kolory tekstu: kod '&' (np. &c - czerwony, &4 - ciemnoczerwony)
#  Po zmianach uzyj: /antylogout reload
# =========================================================

antylogout:
  # Po restarcie serwera zawsze wylaczony. Wlaczasz recznie: /antylogout wlacz
  enabled: false

  # Ile sekund gracz jest "w walce" od ostatniego trafienia (przez gracza lub przez niego).
  czas-walki-sekund: 30

  # Bossbar pokazywany graczowi w walce.
  bossbar:
    kolor: RED       # dostepne: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    styl: SOLID       # dostepne: SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
    # %sekundy% zostanie podmienione na pozostala liczbe sekund walki.
    tytul: "&cJestes w walce jeszcze przez &4%sekundy%s!"

  # Komendy dozwolone podczas walki (bez ukosnika, malymi literami).
  # Pozostale komendy sa blokowane az do konca walki.
  dozwolone-komendy:
    - msg
    - r
    - helpop

  wiadomosci:
    komenda-zablokowana: "&cNie mozesz uzyc tej komendy podczas walki!"
    tylko-gracz: "&cTa komenda jest dostepna tylko dla graczy!"
    brak-uprawnien: "&cNie masz uprawnien do tej komendy!"
    config-przeladowany: "&aPrzeladowano antylogout.yml."
    status: "&8[&cAntylogout&8] &7enabled=&f%enabled% &7czas-walki=&f%czas%s &7graczy-w-walce=&f%ile%"
    wlaczony: "&8[&cAntylogout&8] &aWlaczono antylogout."
    wylaczony: "&8[&cAntylogout&8] &cWylaczono antylogout."