# ════════════════════════════════════════════════════════════════════
#  OSIĄGNIĘCIA
# ════════════════════════════════════════════════════════════════════
#  kategorie.<id>:
#    klucz          - nazwa wewnetrzna (dane graczy, base_money, rewards).
#                     NIE ZMIENIAJ jej po starcie serwera, bo gracze straca
#                     informacje o odebranych nagrodach.
#    nazwa          - nazwa wyswietlana w GUI
#    ikona          - material w menu glownym
#    slot           - slot w menu glownym (45 slotow, 0-44)
#    zrodlo         - skad brac postep:
#                     ZABOJSTWA, RANKING, WYKOPANE_BLOKI, POSTAWIONE_BLOKI,
#                     CZAS_GRY (godziny), BOSS_DMG (obrazenia zadane bossom),
#                     POZIOM (poziom z /poziom), STATYSTYKA (dowolna vanilla)
#    statystyka     - nazwa statystyki Bukkit (tylko dla zrodlo: STATYSTYKA)
#    dzielnik       - przez ile podzielic statystyke (np. 100000 = cm -> km)
#    jednostka      - tekst po liczbie w opisie
#    nagroda-bazowa - kasa za poziom = nagroda-bazowa * poziom
#                     (wpis w base_money nadpisuje te wartosc)
#    progi          - lista wymagan; kazdy element = kolejny poziom
#    komendy.<poziom> - opcjonalne komendy z konsoli po odebraniu ({player})
#
#  Przedmioty-nagrody dodajesz w grze:
#    /osiagniecia admin additem <kategoria> <poziom>
# ════════════════════════════════════════════════════════════════════

