powiadomienia:
  # Co ile sekund sprawdzac, czy gracz ma cos do odebrania (0 = wylaczone)
  co-ile-sekund: 60
  wiadomosc: "&8» &a✔ &fᴏsɪᴀɢɴɪęᴄɪᴇ ɢᴏᴛᴏᴡᴇ: {nazwa} &f#{poziom} &8(&7/osiagniecia&8)"
  wiele: "&8» &a✔ &fᴍᴀsᴢ &a{ilosc} &fᴏsɪᴀɢɴɪęć ᴅᴏ ᴏᴅᴇʙʀᴀɴɪᴀ &8(&7/osiagniecia&8)"
