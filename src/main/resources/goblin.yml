# ── Boss: Goblin (zombie z zelaznym mieczem) ──────────────────────────
# Zarzadzanie: /admingoblin <spawn|kill|info|reload|respawn|ustawspawn|top|editdrop>
#
# Boss spawnuje sie jako zwykly zombie (szybszy, mocniejszy, miecz zelazny).
# Ten config odpowiada za HP/respawn/bossbar/nagrody.

settings:
  enabled: true
  nazwa: '&a&lGOBLIN'
  hp-max: 5000.0
  # Bazowe obrazenia zadawane przez bossa (Bukkit attribute ATTACK_DAMAGE).
  # UWAGA: to tylko baza do animacji/AI - realne obrazenia zadawane graczowi
  # sa wymuszane na stale (patrz "obrazenia-stale-hp" ponizej).
  obrazenia: 20.0
  # Realne obrazenia (w HP, 1 serce = 2 HP) zadawane graczowi przez KAZDE
  # uderzenie Goblina, niezaleznie od jego zbroi/enchantow.
  # 0.0 = Goblin nie zadaje graczom żadnych obrazen.
  obrazenia-stale-hp: 10.0
  # Ile HP odbiera bossowi KAZDE uderzenie gracza (miecz/luk/kusza), niezaleznie
  # od enchantow, sily zamachu i krytykow. To jest JUZ realna wartosc HP (nie
  # przechodzi przez zaden dodatkowy mnoznik) - 1.0 = kazdy hit zabiera dokladnie
  # 1 realne HP bossowi. 0 = wylaczone (boss przyjmuje wtedy normalne obrazenia
  # z broni gracza, przeskalowane proporcjonalnie do hp-max).
  obrazenia-od-gracza-hp: 1.0
  # Predkosc poruszania sie bossa.
  predkosc: 0.42
  # Czy boss ma glow/blask, zeby latwiej go dostrzec.
  swiecacy: true
  # Czy boss moze sam despawnowac (persistent - zalecane true).
  persistent: true

# ── Respawn ───────────────────────────────────────────────────────────
respawn:
  automatyczny: true
  # Po ilu sekundach od smierci respi sie boss. 28800 = 8 godzin.
  czas-sekund: 28800
  # Czy przy starcie/restarcie serwera boss ma pojawic sie OD RAZU.
  spawn-przy-starcie: false
  # Lokalizacja spawnu bossa. Ustawiana komenda "/admingoblin ustawspawn".
  swiat: pvp
  x: -46.52689501871484
  y: -1.0
  z: 117.48721275774956
  yaw: 29.2816162109375

# ── BossBar ───────────────────────────────────────────────────────────
bossbar:
  kolor: GREEN
  styl: SOLID
  # %hp% - aktualne hp (liczba calkowita)
  # %hpmax% - maksymalne hp
  # %procent% - procent hp
  # %czas% - czas do respawnu (gdy boss jest martwy)
  tytul-zywy: '&a&lGOBLIN &8[&c%hp%/%hpmax% HP&8]'
  tytul-martwy: '&8Goblin odrodzi się za: &a%czas%'

# ── Wiadomosci ────────────────────────────────────────────────────────
messages:
  prefix: '&8[&a&lBoss&8] '
  spawn: '&aGoblin wyszedł z nor i grasuje po świecie!'
  smierc: '&a%zabojca% &7zadal ostateczny cios Goblinowi! Boss zostal pokonany!'
  tytul-smierci-podtytul: '&fZostal pokonany!'
  brak-obrazen-do-nagrod: '&7Nikt nie zadal wystarczajacych obrazen, aby otrzymac
    nagrode za TOP.'
  respawn-wkrotce: '&7Goblin odrodzi sie za &a%czas%&7!'
  nie-mozna-zaatakowac-innego-swiata: '&cNie mozesz zaatakowac Goblina z innego swiata.'

# ── Nagrody za samo uderzenie bossa (wymaga Vault) ──────────────────
nagroda-za-uderzenie:
  wlaczone: true
  cooldown-sekund: 5
  pieniadze-min: 5.0
  pieniadze-max: 15.0
  wiadomosc: '&a+%kwota%$ &7za trafienie Goblina!'

# ── Nagrody za TOP obrazen zadanych bossowi ──────────────────────────
nagrody-top:
  wlaczone: true
  top-1:
    pieniadze: 2000.0
    komendy:
      - eco give %gracz% 2000
    wiadomosc: '&6&l1 MIEJSCE &7w zadanych obrazeniach Goblinowi! &a+2000$'
  top-2:
    pieniadze: 1000.0
    komendy: []
    wiadomosc: '&e&l2 MIEJSCE &7w zadanych obrazeniach Goblinowi! &a+1000$'
  top-3:
    pieniadze: 500.0
    komendy: []
    wiadomosc: '&f&l3 MIEJSCE &7w zadanych obrazeniach Goblinowi! &a+500$'
  ostatni-cios:
    wlaczone: true
    pieniadze: 500.0
    komendy: []
    wiadomosc: '&d&lOSTATNI CIOS &7Goblinowi! &a+500$'

# ── Drop przedmiotow przy TRAFIENIU bossa ────────────────────────────
# Sam drop (itemy + szanse) edytujesz w GUI: /admingoblin editdrop
drop-za-trafienie:
  wlaczone: true
  cooldown-sekund: 1.0

# ── Drop przedmiotow po smierci (opcjonalnie, oprocz pieniedzy) ────────
drop:
  - material: DIAMOND
    ilosc-min: 5
    ilosc-max: 15
    szansa: 100.0
  - material: NETHERITE_INGOT
    ilosc-min: 1
    ilosc-max: 3
    szansa: 35.0
