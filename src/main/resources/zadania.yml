# Menu /mistrzzadan (alias /zadania) - konfiguracja.
# Po zmianach: /mistrzzadan reload

tytul: "&6&lZadania"

# Reset postepu: DAILY = codziennie o polnocy (czas serwera), NEVER = nigdy
reset: DAILY

# Nazwa i kolor nagrody widoczne w lore i na czacie
nagroda-nazwa: "Smoczych Odłamków"
nagroda-kolor: "&#8A4FFF"

# Rangi od NAJNIZSZEJ do NAJWYZSZEJ. Gracz dostaje nagrode najwyzszej rangi, do ktorej ma
# KTORYKOLWIEK z permissions. Ranga bez permissions pasuje zawsze (GRACZ).
# "etykieta" to tekst widoczny w lore (opcjonalny).
rangi:
  gracz:
    nazwa: "GRACZ"
    permissions: []
    kolor: "&7"
    etykieta: "&7[GRACZ]"
    nagroda: 4
  vip:
    nazwa: "VIP"
    permissions: ["group.vip"]
    kolor: "&e"
    etykieta: "&e[VIP]"
    nagroda: 6
  svip:
    nazwa: "SVIP"
    permissions: ["group.svip"]
    kolor: "&6"
    etykieta: "&6[SVIP]"
    nagroda: 6
  gzib:
    nazwa: "GZIB"
    permissions: ["group.gzib"]
    kolor: "&b"
    etykieta: "&b[GZIB]"
    nagroda: 8
  og:
    nazwa: "OG"
    permissions: ["group.og"]
    kolor: "&c"
    etykieta: "&c[OG]"
    nagroda: 12

# Zadania (slot = pozycja w menu 5-rzedowym, 20-23 to srodkowy rzad jak w oryginale)
zadania:
  zabojstwa:
    nazwa: "&cZabójstwa"
    opis: "Zabij"
    cel: 25
    material: DIAMOND_SWORD
    slot: 20
  ranking:
    nazwa: "&eZdobyty ranking"
    opis: "Zdobyty ranking"
    cel: 600
    material: NETHER_STAR
    slot: 21
  boss:
    nazwa: "&dUderzenia Bossa"
    opis: "Uderzono"
    cel: 50
    material: WITHER_SKELETON_SKULL
    slot: 22
  bloki:
    nazwa: "&bWykopane bloki na PVP"
    opis: "Rozkop generatorów"
    cel: 25000
    material: DIAMOND_PICKAXE
    slot: 23
