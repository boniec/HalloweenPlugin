# TikTok nie ma publicznego API "wszystkie filmy po nicku".
# Plugin pobiera publiczne filmy z embedu profilu (najnowsze na koncie).
api:
  cache-sekund: 90
  max-filmow: 30

# W OPISIE PROFILU TikToka musi byc nick konta Minecraft.
# %gracz% = nick z gry. wzor = regex (case-insensitive).
# Na liscie sa tylko filmy z jednym z hashtagow.
wymagania:
  opis-przyklad: "nick: %gracz%"
  opis-wzor: "nick\\s*:\\s*%gracz%(?![A-Za-z0-9_])"
  hashtagi:
    - szakaria
    - szakariapl

# Nagroda przy akceptacji: 1 vPLN za kazde pelne 300 wyswietlen.
# Po 5 zaakceptowanych filmach +10% vPLN.
nagrody:
  pieniadze: 0
  wyswietlen-na-vpln: 300
  min-wyswietlen: 300
  vpln-za-pakiet: 1.0
  vpln: 1.0
  booster:
    po-filmow: 5
    procent: 10.0
  komendy: []
  # - "give %gracz% diamond 1"

