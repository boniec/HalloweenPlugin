name: Inventory
version: '0.3'
main: boniec.dev.inventory.Main
api-version: '1.21'
author: boniec
description: Inventory (kity, steal-on-kill, system bogow) + scalony system Klanow.
softdepend: [PlaceholderAPI, WorldGuard, Vault, MythicMobs, Nexo]
# JDA z Maven Central.
libraries:
  - net.dv8tion:JDA:5.2.1

commands:
  siema:
    description: Wyświetla nick wskazanego gracza na środku jego ekranu.
    usage: /siema <nick>
  kosz:
    description: Otwiera prywatny kosz.
    usage: /kosz
  repair:
    description: Naprawia przedmiot trzymany w ręce.
    usage: /repair
  repairall:
    description: Naprawia wszystkie przedmioty w ekwipunku.
    usage: /repairall
  msg:
    description: Wysyła prywatną wiadomość do gracza.
    aliases: [tell, w, whisper]
    usage: /msg <gracz> <wiadomość>
  r:
    description: Odpowiada na ostatnią prywatną wiadomość.
    aliases: [reply]
    usage: /r <wiadomość>
  ignore:
    description: Włącza lub wyłącza ignorowanie gracza.
    usage: /ignore <gracz>
  spy:
    description: Włącza lub wyłącza podgląd prywatnych wiadomości.
    permission: pw.spy
    usage: /spy
  kit:
    description: Otwiera GUI z dostępnymi zestawami (kitami).
    usage: /kit
  adminkit:
    description: Panel administracyjny zestawów (kitów).
    usage: /adminkit [reload|create <nazwa> <cooldown> <permisja> <slot>|edit <nazwa>]
    permission: core.adminkit
  mistrz:
    description: Otwiera menu losowania bohaterów.
    usage: /mistrz
    aliases: [patron, bohater]
  glosuj:
    description: Głosowanie na godzinę bohatera.
    usage: /glosuj <nazwa>
  adminmistrz:
    description: Administracja godzinami bohaterów.
    usage: /adminmistrz forcehour <bóg> | vote <bóg1> <bóg2> [sekundy]
    permission: mistrz.admin
  mistrzzadan:
    description: Otwiera menu zadan z nagrodami w Smoczych Odlamkach.
    usage: /mistrzzadan [reset <gracz> | reload]
    aliases: [zadania]
  adminpatron:
    description: Ustawia przedmiot odłamków do losowania i pozwala go wydawać graczom.
    usage: /adminpatron setodlamek [amount] | giveodlamek <gracz> [ilość] | resetdraw <gracz>
    permission: mistrz.admin
  klan:
    description: Glowna komenda systemu klanow.
    aliases: [clan, klany]
    usage: /klan <stworz|usun|opusc|dolacz|wyrzuc|zaproszenie|lider|zastepca|info|ulepszenia|skarbiec|pvp|topki|pomoc>
  topki:
    description: Otwiera ranking klanow i graczy (topki).
    aliases: [ranking, rankingi]
    usage: /topki
  adminklan:
    description: Komendy administracyjne systemu klanow.
    usage: /adminklan <usun|ustawodlamki|dodajodlamki|info|sprawdz|reload> [tag] [ilosc]
    permission: klany.admin
  aresetranking:
    description: Resetuje ranking i statystyki PvP wszystkich graczy (tylko konsola).
    usage: /aresetranking all
  szaman:
    description: Otwiera GUI artefaktow Szamana.
    usage: /szaman
  adminzeus:
    description: Zarzadzanie bossem Zeus
    permission: zeus.admin
    usage: /adminzeus <spawn|kill|info|reload|respawn|ustawspawn|top|editdrop>
    aliases: [zeusadmin]
  admingoblin:
    description: Zarzadzanie bossem Goblin
    permission: goblin.admin
    usage: /admingoblin <spawn|kill|info|reload|respawn|ustawspawn|top|editdrop>
    aliases: [goblinadmin]
  warp:
    description: Teleportacja pod zapisany warp
    usage: /warp [nazwa]
  helpop:
    description: Prośba o pomoc administracji (wiadomość do staffu)
    usage: /helpop <wiadomość>
  adminwarp:
    description: Tworzenie i usuwanie warpow
    permission: warp.admin
    usage: /adminwarp <create|delete> <nazwa>
  aportal:
    description: Portale TP (wand, nazwa, cel). Bez dzwieku.
    permission: portal.admin
    usage: /aportal <wand|stworz|cel|usun|lista>
  spawn:
    description: Teleportuje na spawn serwera
    usage: /spawn
  ustawspawn:
    description: Ustawia spawn serwera w Twojej lokalizacji
    usage: /ustawspawn
    aliases: [setspawn]
    permission: spawn.admin
  aszaman:
    description: Komendy administracyjne Szamana (Fragmenty Galaktyki, poziomy perkow graczy).
    usage: /aszaman <ustawodlamek|dajodlamek|ustawperk|resetperkow|sprawdz|max|maxdrop> [...]
  adminmetin:
    description: "Zarządzanie systemem Metin"
    usage: "/adminmetin <spawn|ustawspawn|drop|usun|lista|info|sethp|setmobhp|setmobinterval|setrespawn|respawn|tp>"
    permission: metin.admin
  metin.admin:
    description: "Dostęp do komend admina Metin"
    default: op
  gornik:
    description: GUI z blokami do kopania i ich cenami (kopanie.yml). Admin - /gornik <kwota|reload|turbodrop>.
    usage: /gornik [kwota|reload|dodaj|usun|turbodrop]
  poziom:
    description: Poziomy postaci - GUI z nagrodami za poziom (/poziom info, /poziom reload).
    usage: /poziom [info|reload]
  apoziom:
    description: Zarzadzanie poziomami graczy (set/add/remove/reset/boost/nagroda).
    usage: /apoziom <set|add|remove|reset|boost|nagroda> ...
    permission: levels.admin
  portfel:
    description: Otwiera sklep vPLN (portfel).
    usage: /portfel
  sklep:
    description: Glowne menu sklepu serwerowego (kupno za $, sklep za czas, rynek, portfel).
    usage: /sklep
    aliases: [shop]
  asklep:
    description: Administracja sklepu serwerowego (reload, dodawanie ofert).
    usage: /asklep <reload|addbuy|rembuy|addtime|remtime>
    permission: sklep.admin
  adminportfel:
    description: Administracja portfelem vPLN.
    usage: /adminportfel <add|take|set|reload|history|check> ...
    permission: portfel.admin
  doladowanie:
    description: Dodaje vPLN graczowi i pokazuje title doladowania calemu serwerowi.
    usage: /doladowanie <nick> <kwota>
    permission: portfel.admin
  bc:
    description: Wysyla ogłoszenie do całego serwera jako title lub na czacie.
    usage: /bc <title|chat> <tresc>
    permission: bc.use
  nagroda:
    description: Kod do odebrania nagrody za dolaczenie na Discorda (admin - /nagroda embed | reload | odlacz).
    usage: /nagroda | /nagroda embed | /nagroda reload | /nagroda odlacz <nick>
  freeturbo:
    description: Aktywuje prywatny TurboDrop (czas i mnoznik z freeturbo.yml, widoczny tylko dla Ciebie).
    usage: /freeturbo | /freeturbo reload
  cofnijbackup:
    description: Cofniecie nadanego backupu graczowi
    usage: /cofnijbackup <nick>
    aliases: [zabierzbackup, backupcofnij]
  admingenerator:
    description: Komendy administracyjne generatorow bloków.
    usage: /admingenerator <stworz <promien> <wysokosc> <blok1> [blok2...]|edytuj|clean>
    aliases: [agenerator]
    permission: core.admingenerator
  eventodlamki:
    description: Odpala/wylacza event Szal Odlamkow (dodatkowy drop odlamkow z generatorow).
    usage: /eventodlamki <start <sekundy>|stop|reload>
    permission: eventodlamki.admin
  kod:
    description: Odbiera kod promocyjny.
    usage: /kod <nazwa>
  adminkod:
    description: Zarzadzanie kodami promocyjnymi.
    permission: admin.kod
    usage: /adminkod <stworz|usun|lista|dodajkomende|usunkomende|reload>
  rynek:
    description: Otwiera GUI rynku gracz-gracz (kupno/sprzedaz przedmiotow).
    usage: /rynek [wystaw <cena> | odbierz | reload | resetall | ustawodlamek]
    aliases: [ah, market]
  arynek:
    description: Komendy administracyjne rynku (szablon Smoczych Odlamkow, wylaczanie handlu w walucie).
    usage: /arynek [ustawodlamek | wylacz|wlacz <pieniadze|odlamki>]
    permission: rynek.admin
  adminabuse:
    description: Efekt AdminAbuse dla wszystkich graczy (tungtungsahur, ciemnosc, rainbow, kula disco, wymuszone skoki).
    usage: /adminabuse start|stop
    permission: abuse.admin
  hitsystem:
    description: Wlasny system obrazen PvP melee skalowany numerem seta.
    usage: /hitsystem <info|reload|debug <on|off>|test <gracz>|elytra [procent]|brakzbroi [procent]>
  adminenchant:
    description: Nadaje wybrany enchant na wybranym poziomie trzymanemu przedmiotowi.
    usage: /adminenchant <enchant> <poziom>
    permission: core.adminenchant
  aulepsz:
    description: Panel administracyjny systemu ulepszen.
    usage: /aulepsz <create|remove|add> <nazwa>
    permission: ulepsz.admin
  ulepsz:
    description: Otwiera GUI systemu ulepszen.
    usage: /ulepsz
  azbroja:
    description: Kreator nazw setow (small caps, gradient hex, numer seta).
    usage: /azbroja nazwa <tekst...>
    permission: azbroja.admin
  osiagniecia:
    description: Otwiera menu osiagniec.
    usage: /osiagniecia
  adminmeteoryt:
    description: Panel administracyjny meteorytow.
    usage: /adminmeteoryt <editdrop|setspawn|gui>
    permission: core.adminmeteoryt
  skup:
    description: Skup itemow z systemu /ulepsz za procent ich ceny (wymaga Vault).
    usage: /skup
  adminczek:
    description: Tworzy w rece admina czek na podana kwote (wymaga Vault).
    usage: /adminczek <kwota>
    permission: admin.czeki
  pay:
    description: Przelewa graczowi podana kwote z Twojego konta (wymaga Vault).
    aliases: [przelej]
    usage: /pay <gracz> <kwota>
  admintitle:
    description: Wysyla ogloszenie do calego serwera jako title lub na czacie.
    usage: /admintitle <title|chat|reload> [tresc]
    permission: admin.bc
  chat:
    description: Czysci czat albo wylacza/wlacza pisanie na czacie.
    usage: /chat <clear|off|on>
    permission: chat.admin
  chatcd:
    description: Ustawia lub sprawdza cooldown na pisanie na czacie.
    usage: /chatcd [ustaw <sekundy>]
    permission: chat.cooldown.admin
  usunbossbar:
    description: Usuwa zbedne bossbary pluginu (Minotaur, TurboDrop, eventy) z ekranow graczy.
    usage: /usunbossbar
    permission: boss.admin
  adminboss:
    description: Komendy administracyjne bossa Minotaur.
    usage: /adminboss <spawn|kill|info|reload|respawn|ustawspawn|top|editdrop>
    permission: boss.admin
  antylogout:
    description: Zarzadzanie systemem antylogout (tag walki).
    usage: /antylogout <wlacz|wylacz|reload|status>
  backup:
    description: System zarzadzania backupami ekwipunkow graczy po smierci.
    usage: /backup <nick> | /backup weryfikacja
  trybtworcy:
    description: Tryb tworcy - po smierci/killu nikt nie traci itemow. Ranking liczy sie normalnie.
    usage: /trybtworcy [gracz] [on|off]
    aliases: [tworca, creatormode]
    permission: inventory.trybtworcy
  odbierzbackup:
    description: Odbiera przyznany backup graczowi i usuwa przedmioty z ekwipunku.
    usage: /odbierzbackup <nick>
  acase:
    description: Admin skrzynek - stworz/usun/ustawlokacje/usunlokacje/edytujdrop/typ/klucz/daj/lista/reload.
    usage: /acase <stworz|usun|ustawlokacje|usunlokacje|edytujdrop|typ|klucz|daj|lista|reload|wylacz|wlacz>  (/acase wylacz <skrzynka|all>)
    permission: acase.admin
  galaktyczna:
    description: Wymien Smocze Odłamki na Galaktyczną Skrzynię (GUI).
    usage: /galaktyczna [reload]
    aliases: [galaktycznaskrzynia, galbox]
  joinkit:
    description: Kit startowy (pierwsze wejscie i po smierci).
    usage: /joinkit edytuj | reload
    permission: joinkit.admin
  bonieccore:
    description: Wyswietla na czacie liste wszystkich komend pluginu wraz z uzyciem.
    usage: /bonieccore
  scoreboard:
    description: Wlacza/wylacza wlasny scoreboard (toggle) albo przeladowuje jego konfiguracje (reload).
    usage: /scoreboard [toggle|reload]
    aliases: [sb, tablica]
  ustawienia:
    description: Wlacza i wylacza wiadomosci (msg, skrzynki, czat, ogloszenia, klany, actionbar, scoreboard).
    usage: /ustawienia
    aliases: [settings, opcje]
  eventy:
    description: GUI z eventami serwera (KOTH, Serce, meteoryty, bossy, Szal Odlamkow).
    usage: /eventy
    aliases: [event, eventlist]
  misje:
    description: GUI dziennych misji (reset o 24:00).
    usage: /misje
    aliases: [misja, dailies]
  amisje:
    description: Administracja misjami (/amisje ustawnagroda <id>|reload|reset).
    usage: /amisje <ustawnagroda|reload|reset>
    permission: misje.admin
  tiktok:
    description: Polacz konto TikTok, dodaj filmy i wyslij do weryfikacji nagrody.
    usage: /tiktok [gui|polacz <nick>|odlacz|dodaj <link>]
    aliases: [tt]
  atiktok:
    description: Panel admina do weryfikacji filmow TikTok i przyznawania nagrod.
    usage: /atiktok [reload]
    permission: tiktok.admin
    aliases: [admintiktok]
  adkoth:
    description: Administracja KOTH-em (start, stop, editdrop, status, reload).
    usage: /adkoth <start [sekundy]|stop|editdrop|status|reload>
    permission: koth.admin
  aserce:
    description: Administracja eventu Serce Kosmosu (spawn, despawn, editdrop, status, reload).
    usage: /aserce <spawn|despawn|editdrop|status|reload>
    permission: serce.admin
  awelna:
    description: Ustawia dropy z welny (red/green/purple/white) i szanse w procentach.
    usage: /awelna <dodaj|usun|szansa|lista|reload>
    permission: welna.admin
  nekromanta:
    description: Menu Nekromanty - wymiana glutow na miecze, wplata glutow i ulepszenia dropu z welny.
    usage: /nekromanta
  anekromanta:
    description: Administracja Nekromanty (nagrody, szanse, gluty).
    usage: /anekromanta <dodaj|usun|szansa|lista|glut|ustawglut|saldo|poziom|reload>
    permission: nekromanta.admin
  coinflip:
    description: Coinflip o Smocze Odlamki.
    aliases: [cf, flip]
    usage: /coinflip [stworz <ilosc>|gry|odbierz]

  eventitems:
    description: Panel eventowych przedmiotow (Kokos, Lampion, Antycobweb, Sakiewka Mandalorianina, Rozdzka Wiedzmy, Hak, Miecz Saurona, Glowy Smokow).
    usage: /eventitems
    permission: polezamek.admin
  dajpolesmierci:
    description: Daje graczowi przedmiot Pola Smierci.
    usage: /dajpolesmierci [gracz]
    permission: polezamek.admin
  zresetujpolesmierci:
    description: Resetuje cooldown Pola Smierci.
    usage: /zresetujpolesmierci [gracz]
    permission: polezamek.admin
  polesmierci:
    description: Konfiguracja Pola Smierci (ustawspawn, ustawspawnpvp, usunspawn, info).
    usage: /polesmierci <ustawspawn|ustawspawnpvp|usunspawn|info>
    permission: polezamek.admin
  dajzamek:
    description: Daje graczowi przedmiot Zamku.
    usage: /dajzamek [gracz]
    permission: polezamek.admin
  dajlodnapatyku:
    description: Daje graczowi Lod na patyku.
    usage: /dajlodnapatyku [gracz]
    permission: polezamek.admin
  dajkokos:
    description: Daje graczowi Kokos.
    usage: /dajkokos [gracz]
    permission: polezamek.admin
  zresetujcooldown:
    description: Resetuje cooldown Zamku.
    usage: /zresetujcooldown [gracz]
    permission: polezamek.admin
  resetujcooldown:
    description: Resetuje cooldowny eventowek. Dziala tylko na regionie spawn.
    usage: /resetujcooldown
  zamekselector:
    description: Daje selektor do zaznaczenia obszaru zamku.
    usage: /zamekselector
    permission: polezamek.admin
  ustawzamek:
    description: Ustawia zamek na zaznaczonym obszarze.
    usage: /ustawzamek
    permission: polezamek.admin
  adminzamek:
    description: Administracja zamkiem.
    usage: /adminzamek <selector|ustawzamek>
    permission: polezamek.admin
  dajrozdzke:
    description: Daje graczowi Rozdzke Wiedzmy.
    usage: /dajrozdzke [gracz]
    permission: polezamek.admin
  dajhak:
    description: Daje graczowi Hak.
    usage: /dajhak [gracz]
    permission: polezamek.admin
  zresetujrozdzke:
    description: Resetuje cooldown Rozdzki Wiedzmy.
    usage: /zresetujrozdzke [gracz]
    permission: polezamek.admin
  polezamekreload:
    description: Przeladowuje konfiguracje modulu PoleZamek.
    usage: /polezamekreload
    permission: polezamek.admin
  duel:
    description: Wyzwanie 1v1 na arenie (gdy event /aduel jest wlaczony).
    usage: /duel <gracz>
    aliases: [walka]
  aduel:
    description: Event i arena dueli.
    usage: /aduel start <czas> | stop | ustawswiat | ustaw1 | ustaw2
    permission: polezamek.admin

  kociol:
    description: Wspólny kocioł Halloween — wpłać cukierki, aby uruchomić bonus dla serwera.
    usage: /kociol [ilość|all]
    permission: ahalloween.use
  ahalloween:
    description: Event Halloween — cukierki, worek, misje, sklep.
    usage: /ahalloween
    aliases: [halloween, ah]
    permission: ahalloween.use

  alts:
    description: Menu kont alternatywnych (to samo IP).
    usage: /alts <gracz>
  sprawdz:
    description: Sprawdzanie gracza na cheaty (zamrożenie, wynik).
    usage: /sprawdz <gracz> [czysty|cheater|brakwspolpracy|przyznanie] | /sprawdz ustaw | /sprawdz lista
    aliases: [check, sprawdzanie]
  mapareset:
    description: Status/wymuszenie resetu bloków postawionych przez graczy.
    usage: /mapareset [teraz]

  aregion:
    description: Blokada wchodzenia na region WorldGuard (odpycha graczy).
    usage: /aregion set|usun|lista [region]

  aafk:
    description: Przeladowanie afk.yml (strefa AFK).
    usage: /aafk

  vanish:
    description: Włącza lub wyłącza niewidzialność (vanish).
    usage: /vanish [gracz]
    aliases: [v, vis]
  tpa:
    description: Wysyła prośbę o teleport do gracza (ważną przez 60 sekund).
    usage: /tpa <gracz>
  tpaccept:
    description: Akceptuje prośbę o teleport (bez nicku najnowszą).
    usage: /tpaccept [gracz]
  tpdeny:
    description: Odrzuca prośbę o teleport (bez nicku najnowszą).
    usage: /tpdeny [gracz]
  tp:
    description: Teleport do gracza (lub gracza do gracza).
    usage: /tp <gracz> | /tp <kto> <do-kogo>
    permission: core.tp
    aliases: [teleport]
  tphere:
    description: Sprowadza gracza do siebie.
    usage: /tphere <gracz>
    permission: core.tphere
    aliases: [s, sprowadz, tph]
  gm:
    description: Zmienia tryb gry (0/s, 1/c, 2/a, 3/sp).
    usage: /gm <tryb> [gracz]
  fly:
    description: Włącza lub wyłącza latanie.
    usage: /fly [gracz]
  god:
    description: Włącza lub wyłącza nieśmiertelność (god).
    usage: /god [gracz]
  heal:
    description: Leczy gracza (zdrowie, głód, ogień, negatywne efekty).
    usage: /heal [gracz]
  feed:
    description: Zapełnia pasek głodu.
    usage: /feed [gracz]
  keepinv:
    description: Włącza lub wyłącza zachowanie ekwipunku po śmierci (bez gamerule).
    usage: /keepinv on|off
    aliases: [keepinventory]
  azonebox:
    description: Strefa, w której można stawiać i niszczyć tylko wybrane bloki (np. cobweb).
    usage: /azonebox add <blok> | region <region> | list
    permission: azonebox.admin
  steruj:
    description: Wcielasz się w gracza i grasz jego postacią.
    usage: /steruj <nick> | /steruj
    permission: core.steruj
    aliases: [wciel]
  invsee:
    description: Podgląd i edycja ekwipunku gracza (także offline), ze zbroją.
    usage: /invsee <gracz>
    permission: core.invsee
  endersee:
    description: Podgląd i edycja enderchesta gracza (także offline).
    usage: /endersee <gracz>
    permission: core.endersee

permissions:
  polezamek.admin:
    description: Dostep do komend modulu PoleZamek (/eventitems, /dajzamek, /dajpolesmierci, /dajrozdzke, /polezamekreload itd.).
    default: op
  acase.admin:
    description: Dostep do /acase (administracja skrzynkami).
    default: op
  joinkit.admin:
    description: Dostep do /joinkit (kit startowy).
    default: op
  serce.admin:
    description: Dostep do /aserce (spawn, despawn, editdrop, status, reload).
    default: op
  inventory.trybtworcy:
    description: Wlaczanie /trybtworcy.
    default: op
  trybtworcy.use:
    description: Alias permisji /trybtworcy.
    default: op
  eventy.admin:
    description: Przeladowanie listy /eventy (eventy.yml).
    default: op
  misje.admin:
    description: Dostep do /amisje (nagrody, reload, reset).
    default: op
  welna.admin:
    description: Dostep do /awelna (ustawianie dropow z welny).
    default: op
  nekromanta.admin:
    description: Dostep do /anekromanta (nagrody, szanse, wydawanie glutow).
    default: op
  bezelek.elytra.bypass:
    description: Pozwala uzywac elytr na regionie bezelek.
    default: false
  koth.admin:
    description: Dostep do /adkoth (start, stop, editdrop, status, reload).
    default: op
  scoreboard.admin:
    description: /scoreboard reload - przeladowanie konfiguracji scoreboardu.
