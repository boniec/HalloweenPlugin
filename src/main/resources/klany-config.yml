# ==========================================================
#   /topki - GUI ze wszystkimi rankingami w jednym miejscu
# ==========================================================
# Caly wyglad tego GUI jest w 100% konfigurowalny - rozmiar, tytul, tlo,
# kazdy item (material albo glowa z custom textura), sloty, nazwy, lore,
# ilosc sztuk w stosie. WSZYSTKIE teksty (nazwa/lore/tytul) to zwykle stringi
# kolorowane tak jak wszedzie indziej w tym pliku - kody & (np. &a, &l) oraz
# hex &#rrggbb litera-po-literze recznie wpisany w tekscie. Mozna wiec wpisac
# doslownie cokolwiek, np. "&#71F3B4#1 GRACZ BONIEC". Po zmianach uzyj
# /adminklan reload.
topki-gui:
  # Rozmiar okna - wielokrotnosc 9, od 9 do 54.
  rozmiar: 54
  tytul: "&#F5EA50☀ &#F5EA50&lTOPKI SYSTEMOWE"

  # Sloty wypelnione dekoracyjnym szklem. Klucz = material (np. gray_stained_glass_pane),
  # wartosc = lista slotow. Mozna dodac dowolna liczbe kolorow.
  tlo:
    gray_stained_glass_pane: [45, 46, 47, 48, 50, 51, 52, 53]

  # Style numerow pozycji uzywane przez placeholder %numer-styl% w "wzor-pozycji" ponizej.
  # Indeks 0 = pozycja #1, indeks 1 = pozycja #2, itd. Kazda linia to zwykly, dowolnie
  # kolorowany tekst (& oraz &#rrggbb) - mozna wpisac cokolwiek. Jesli lista jest krotsza
  # niz aktualna pozycja (np. masz tylko 3 style a topka ma 15 pozycji), dalsze pozycje
  # dostana prosty fallback "&8#<numer>".
  style-numerow:
    - "&#EF4141&l#1 &6🥇"
    - "&#F14851&l#2 &8🥈"
    - "&#F44F61&l#3 &c🥉"
    - "&#F65671&l#4"
    - "&#F85D81&l#5"
    - "&#FD6BA1&l#6"
    - "&#FF72B1&l#7"
    - "&#FC6A9E&l#8"
    - "&#FA628C&l#9"
    - "&#FB5D78&l#10"
    - "&#F85264&l#11"
    - "&#F54750&l#12"
    - "&#F23C3C&l#13"
    - "&#EF3128&l#14"
    - "&#EC2614&l#15"

  # Kazdy wpis ponizej to jedna "kostka" topki w GUI. Klucz (np. "pieniadze") jest
  # tylko identyfikatorem wewnetrznym - "pieniadze" i "ranking-klanu" maja realne
  # dane z systemu klanow (skarbiec / ELO), reszta ponizej to gotowe miejsca pod
  # przyszle topki (czas gry, bloki, ranking graczy, zabojstwa) - obecnie pokazuja
  # tekst z "lore-brak-danych", dopoki nie zostana podpiete pod baze danych.
  #
  # Pola dostepne dla kazdej topki:
  #   slot              - pozycja w GUI (0-53, zalezne od "rozmiar")
  #   material          - typ przedmiotu (np. SUNFLOWER, DIAMOND_SWORD, PLAYER_HEAD...)
  #   glowa-tekstura    - (opcjonalne) base64 tekstury glowy gracza (np. z minecraft-heads.com) -
  #                       jesli ustawione, NADPISUJE "material" i uzywa glowy z ta textura
  #   ilosc             - ile sztuk w stosie (domyslnie 1)
  #   custom-model-data - CustomModelData dla resource packow (0 = wylaczone)
  #   nazwa             - nazwa wyswietlana itemu - zwykly tekst z kolorami & / &#rrggbb
  #   naglowek          - lista linii lore wstawiana NA POCZATKU (np. linia oddzielajaca)
  #   wzor-pozycji      - wzor pojedynczej linii rankingu - wpisz dowolny tekst z wlasnymi
  #                       kolorami, uzywajac ponizszych placeholderow:
  #                         %numer%      - numer pozycji (1, 2, 3...)
  #                         %numer-styl% - gotowy "#1/#2/#3..." z medalami ze "style-numerow" wyzej
  #                         %nazwa%      - nazwa klanu/gracza na tej pozycji
  #                         %wartosc%    - wartosc (np. ilosc odlamkow, ELO)
  #                       przyklad: "&#71F3B4#%numer% GRACZ %nazwa% &8- &a%wartosc%"
  #   limit             - ile pozycji pokazac (domyslnie 15)
  #   lore-pusta-lista  - lore uzywane gdy topka jest pusta (np. brak jeszcze klanow)
  #   lore-brak-danych  - lore uzywane dla topek bez podlaczonego zrodla danych
  #                       (np. czas gry/bloki/zabojstwa - wymagaja bazy danych)
  #   stopka            - lista linii lore wstawiana NA KONCU
  topki:
    pieniadze:
      slot: 0
      material: SUNFLOWER
      nazwa: "&#71F3B4☁ &fTOPKA PIENIĘDZY"
      naglowek:
        - "&8━━━━━━━━━━━━━━━━━━━━━━━━━"
      wzor-pozycji: "%numer-styl% %nazwa% &8- &#71F3B4%wartosc%"
      limit: 15
      lore-pusta-lista:
        - "&7Brak klanow do wyswietlenia."
      stopka:
        - "&8━━━━━━━━━━━━━━━━━━━━━━━━━"

    ranking-klanu:
      slot: 1
      material: COMPARATOR
      nazwa: "&#A771F3★ &fTOPKA RANKINGU KLANÓW"
      naglowek:
        - "&8━━━━━━━━━━━━━━━━━━━━━━━━━"
      wzor-pozycji: "%numer-styl% %nazwa% &8- &#A771F3%wartosc% ELO"
      limit: 15
      lore-pusta-lista:
        - "&7Brak klanow do wyswietlenia."
      stopka:
        - "&8━━━━━━━━━━━━━━━━━━━━━━━━━"

    czas-gry:
      slot: 2
      material: CLOCK
      nazwa: "&#F1935D✎ &fTOPKA CZASU GRY"
      naglowek:
        - "&8━━━━━━━━━━━━━━━━━━━━━━━━━"
      lore-brak-danych:
        - "&#F1935D✎ Czasy gry TOP 15"
        - "&8(Wymaga konfiguracji bazy danych)"
      stopka:
        - "&8━━━━━━━━━━━━━━━━━━━━━━━━━"

    bloki:
      slot: 3
      material: DIAMOND_PICKAXE
      nazwa: "&#F5EA50☀ &fTOPKA BLOKÓW"
      naglowek:
        - "&8━━━━━━━━━━━━━━━━━━━━━━━━━"
      lore-brak-danych:
        - "&#F5EA50☀ Bloki TOP 15"
        - "&8(Wymaga konfiguracji bazy danych)"
      stopka:
        - "&8━━━━━━━━━━━━━━━━━━━━━━━━━"

    ranking-graczy:
      slot: 4
      material: PLAYER_HEAD
      # Przyklad uzycia wlasnej glowy z textura zamiast zwyklej PLAYER_HEAD - odkomentuj
      # i wklej base64 (np. z minecraft-heads.com), zeby uzyc customowej ikony:
      # glowa-tekstura: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHBzOi8vdGV4dHVyZXMubWluZWNyYWZ0Lm5ldC90ZXh0dXJlLy4uLiJ9fX0="
      nazwa: "&#B7F550☂ &fTOPKA RANKINGU GRACZY"
      naglowek:
        - "&8━━━━━━━━━━━━━━━━━━━━━━━━━"
      lore-brak-danych:
        - "&#B7F550☂ Ranking graczy TOP 15"
        - "&8(Wymaga konfiguracji bazy danych)"
      stopka:
        - "&8━━━━━━━━━━━━━━━━━━━━━━━━━"

    zabojstwa:
      slot: 5
      material: DIAMOND_SWORD
      nazwa: "&#F33C5A♔ &fTOPKA ZABÓJSTW"
      naglowek:
        - "&8━━━━━━━━━━━━━━━━━━━━━━━━━"
      lore-brak-danych:
        - "&#F33C5A♔ Zabójstwa TOP 15"
        - "&8(Wymaga konfiguracji bazy danych)"
      stopka:
        - "&8━━━━━━━━━━━━━━━━━━━━━━━━━"

  przycisk-zamkniecia:
    slot: 49
    material: BARRIER
    nazwa: "&c&lZAMKNIJ"

# ==========================================================
#   SKINY NPC Z TOPEK (Citizens / FancyNPCs)
#   NPC dostaje skin gracza zwroconego przez placeholder.
#   Odswiezane co interwal-sekundy, zmiana configu: /adminklan reload
# ==========================================================
top-npc:
  wlaczone: true
  # CITIZENS albo FANCYNPCS
  plugin: FANCYNPCS
  # Co ile sekund sprawdzac topki (min. 30 - pobieranie skina z Mojanga chwile trwa)
  interwal-sekundy: 300
  log: true
  komenda-citizens: "npc skin {nick} --id {npc}"
  # FancyNPCs: {npc} = NAZWA NPC (ta z /npc list), nie numer
  komenda-fancynpcs: "npc skin {npc} {nick}"
  # id = nazwa NPC w FancyNPCs (litery, cyfry, _ i -)
  # %klany_top_ekonomia_<N>_nick% = topka kasy graczy (Vault)
  npc:
    - id: "topkasa1"
      placeholder: "%klany_top_ekonomia_1_nick%"
    - id: "topkasa2"
      placeholder: "%klany_top_ekonomia_2_nick%"
    - id: "topkasa3"
      placeholder: "%klany_top_ekonomia_3_nick%"
