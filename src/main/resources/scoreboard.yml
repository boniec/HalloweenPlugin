# ==========================================================
#   SCOREBOARD (sidebar) - konfiguracja
#   Zmiany: edytuj plik i wpisz /scoreboard reload
# ==========================================================

wersja: 4
wlaczony: true

# Co ile tickow odswiezac tresc (20 = 1 sekunda). Jesli uzywasz animowanego tytulu,
# ustaw tu wartosc nie wieksza niz tytul-klatka-tickow.
interwal-tickow: 20

# Ukrywa czerwone numerki po prawej (dziala na Paper 1.20.3+, na Spigocie numerki zostana).
ukryj-numery: true

# Swiaty, w ktorych scoreboard sie NIE wyswietla (nazwy swiatow)
wylaczone-swiaty: []

# Mapowanie nazwy swiata Bukkit -> tekst na scoreboardzie (%swiat%)
swiaty:
  world: skywpl
  world_nether: nether
  world_the_end: end

# Tytul. Moze byc pojedynczym tekstem ALBO lista klatek (wtedy tytul sie animuje).
tytul: '&#4FD8FF&lꜰʟᴀᴍᴇʜᴜʙ&d&l_ᴘʟ'
# Przyklad animacji (odkomentuj, a linie wyzej usun):
# tytul:
#   - '&#4FD8FF&lꜰʟᴀᴍᴇʜᴜʙ&d&l_ᴘʟ'
#   - '&d&lꜰʟᴀᴍᴇʜᴜʙ&#4FD8FF&l_ᴘʟ'
tytul-klatka-tickow: 10

# Linie (od gory do dolu, maksymalnie 15). Obslugiwane:
#   - kolory &a, &l ... oraz hex &#RRGGBB
#   - %player% (nick), %swiat%, %czas% oraz placeholdery PlaceholderAPI
# Ikony Nexo po "&f" (glify z ikony.yml / glyphs.yml):
# 丹 globus, 圍 gracz, 丽 korona, 劍 zegar, 價 kasa, 乌 kula XP,
# 媽 patron, 澀 ranking, 丱 PvP, 歲 czaszka, 轉 klan
linie:
  - '&f丹 &fZnajdujesz się na:'
  - '&4skypvp1 &7(&f/ch&7)'
  - ''
  - '&f圍 &fNick: &#7CFFB2%player%'
  - '&f丽 &fRanga: &#FFD85C%luckperms_prefix%'
  - '&f劍 &fCzas: &#70F3FF%czas%'
  - '&f價 &fPieniądze: &#FFD85C%vault_eco_balance_formatted%'
  - '&f乌 &fXP: &5★%levels_level% &d%levels_current_exp%&8/%levels_next_level_exp%'
  - '&f媽 &fCzarodziej: &f%inventory_patron%'
  - '&f澀 &fPunkty: &#F5B758%klany_gracz_ranking% &f%klany_gracz_pozycja%'
  - '&f丱 &fKD: &#FF6B6B%klany_gracz_zabojstwa% &#F5B758%klany_gracz_zabojstwa_pozycja% &8/ &f歲 &#AAAAAA%klany_gracz_smierci% &#F5B758%klany_gracz_smierci_pozycja%'
  - '&8'
  - '&f轉 %klany_score_1%'
  - '&f轉 &7%klany_score_2%'

wiadomosci:
  wlaczony: "&aScoreboard zostal &lwlaczony&a."
  wylaczony: "&cScoreboard zostal &lwylaczony&c. Wlaczysz go ponownie przez &e/scoreboard&c."
  przeladowano: "&aPrzeladowano konfiguracje scoreboardu."
  brak-uprawnien: "&cNie masz uprawnien do tej komendy."
  tylko-gracz: "&cTa komenda jest dostepna tylko dla graczy."
