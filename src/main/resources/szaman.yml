      cost: 50
      value: 1
    '2':
      cost: 100
      value: 2
    '3':
      cost: 150
      value: 3
    '4':
      cost: 200
      value: 4
  confinement:
    '1':
      cost: 100
      value: 2
    '2':
      cost: 150
      value: 3
    '3':
      cost: 200
      value: 4
  weakening:
    '1':
      cost: 50
      value: 1
    '2':
      cost: 100
      value: 2
    '3':
      cost: 150
      value: 3
    '4':
      cost: 200
      value: 4
  block:
