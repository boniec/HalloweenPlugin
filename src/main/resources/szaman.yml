# --- Boost Dropu: losowanie procentu (jak dotychczasowy Perk Dropu) ---
# Kazde ulepszenie dodaje losowy % (min-max) do zarobku z kopania generatorow.
# Koszt rosnie z liczba losowan (progi-kosztow); powyzej progu-wysokiego-kosztu % stala cena.
# Globalny cap poziomow perkow (confinement/health/strength/...). 0 = bez dodatkowego limitu (poziomy z data).
# /aszaman max 1  -> nikt nie ulepszy powyzej 1.  /aszaman max 0 -> znow bez capu.
limity:
  max-poziom: 0

perk-dropu:
  wartosc-min: 3.0
  wartosc-max: 10.0
  # Max % Boostu Dropu. /aszaman maxdrop 50
  limit: 200.0
  prog-wysokiego-kosztu: 70.0
  koszt-powyzej-progu: 50
  progi-kosztow:
    - { do: 4, koszt: 10 }
    - { do: 9, koszt: 20 }
    - { do: 13, koszt: 30 }
    - { do: -1, koszt: 30 }

# --- Poziomy: koszt (Fragmenty Galaktyki) i wartosc kazdego poziomu ---
# value: strength = +% damage, vampirism = % szansy na leczenie,
#        weakening = % szansy na glowing, block = % szansy na zablokowanie ciosu,
#        confinement = sekundy uwiezienia, health = dodatkowe SERCA (1 = 2 HP).
data:
  health:
    '1':
      cost: 50
      value: 0.5
    '2':
      cost: 100
      value: 1
    '3':
      cost: 150
      value: 1.5
    '4':
      cost: 200
      value: 2
  strength:
