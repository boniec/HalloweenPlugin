# /galaktyczna — wymiana Smoczych Odłamków na skrzynkę z /acase
# Skrzynkę ustawiasz w /acase (np. id: galaktyczna, typ LOOTBOX).

koszt-odlamkow: 70
skrzynka-id: galaktyczna
ilosc-skrzyn: 1

gui:
  tytul: "&8&lGalaktyczna skrzynia"
  wielkosc: 27
  slot-info: 4
  slot-wymiana: 13
  slot-zamknij: 22
  ramka: GRAY_STAINED_GLASS_PANE
  info:
    material: NETHER_STAR
    nazwa: "&d&lGalaktyczna skrzynia"
    lore:
      - "&0"
      - "&7Wymień &d%koszt% &7Smoczych Odłamków"
      - "&7na &dGalaktyczną Skrzynię&7."
      - "&0"
      - "&7Masz: &d%masz% &8/ &d%koszt%"
      - "&0"
      - "&8Skrzynka musi istnieć w &f/acase lista"
  wymiana:
    material: END_CRYSTAL
    nazwa-gotowe: "&a&lOdbierz skrzynię"
    nazwa-brak: "&c&lZa mało odłamków"
    lore-gotowe:
      - "&0"
      - "&7Kliknij, aby wymienić &d%koszt% &7odłamków."
      - "&0"
      - "&a✔ Masz wystarczająco odłamków"
    lore-brak:
      - "&0"
      - "&7Potrzebujesz &d%koszt% &7odłamków."
      - "&7Masz tylko &c%masz%&7."
      - "&0"
      - "&c✘ Brakuje &f%brakuje% &codłamków"
  zamknij:
    material: BARRIER
    nazwa: "&cZamknij"

messages:
  prefix: "&8[&dGalaktyczna&8] "
  tylko-gracz: "&cTę komendę może użyć tylko gracz."
  brak-odlamkow: "&cMasz za mało Smoczych Odłamków! &7(%masz%&8/&7%koszt%)"
  brak-skrzynki: "&cSkrzynka &f%id% &cnie istnieje. Poproś admina o &f/acase stworz %id%"
  sukces: "&aWymieniono &d%koszt% &aodłamków na &dGalaktyczną Skrzynię&a!"
  blad-zabierania: "&cNie udało się pobrać odłamków z ekwipunku."
  brak-miejsca: "&eSkrzynia wpadła pod nogi — ekwipunek był pełny."
