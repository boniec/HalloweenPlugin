# =========================================================
#  POZIOMY.YML - Poziomy postaci (port Dream-FlameHubLevels)
#
#  Gracz zbiera exp TYLKO za kopanie i zabijanie graczy.
#
#  Komendy:
#   /poziom              - GUI z nagrodami
#   /poziom info         - postep na czacie
#   /poziom reload       - przeladowanie tego pliku (levels.reload)
#   /apoziom ...         - zarzadzanie (levels.admin), patrz /apoziom
#
#  Placeholdery (PlaceholderAPI), takie same jak w starym pluginie:
#   %levels_level% %levels_current_exp% %levels_next_level_exp% %levels_progress_bar%
#   %levels_top_name_1% .. %levels_top_name_20%, %levels_top_level_1% .. %levels_top_level_20%
#   nowe: %levels_top_exp_N% %levels_percent% %levels_boost% %levels_boost_time%
#
#  Dane graczy: poziomy-dane.yml (zapis co 10s gdy sie zmienily, przy wyjsciu gracza i stopie serwera).
#  Nie ruszaj progi-skumulowane - musi byc false (koszt wejscia na poziom, nie suma calego expa).
#  Kolory: & kody, &#RRGGBB, &x&R&R&G&G&B&B
# =========================================================

# Exp wymagany na WEJSCIE na dany poziom (pasek gracza na poziomie nizszym).
# Przykladowo 2: 50 znaczy: na poziomie 1 pasek to 0/50, po zapelnieniu reset i poziom 2.
# /apoziom nagroda 6 exp 2500  ->  nowy poziom 6, pasek na 5 to 0/2.5k
# false = liczby ponizej to koszt WEJSCIA na poziom. true tylko przy starym formacie (suma expa).
progi-skumulowane: false
poziomy:
  1: 0
  2: 50
  3: 100
  4: 250
  5: 500

# Gracze z ta permisja NIE zbieraja expa (domyslnie nikt jej nie ma, nawet OP).
bypass-permisja: "levels.bypass"

exp:
  kopanie:
    ilosc: 1
    bloki:
      - STONE
  # Kopanie: exp za blok ustawiasz w kopanie.yml (sekcja exp-bloki), nie tutaj.
  stawianie:
    ilosc: 0
    bloki:
      - DIRT
  # Za zabicie gracza
  # Za zabicie gracza (exp na pasku poziomu)
  zabojstwo: 500
  dystans:
    ilosc: 0
    co-ile-kratek: 10.0
    wylaczone-regiony:
      - spawn
  jedzenie:
    ilosc: 0
    przedmioty:
      - GOLDEN_APPLE

# Boost expa: /apoziom boost <mnoznik> <czas>
boost:
  bossbar: true
  kolor: PURPLE
  styl: SOLID

pasek:
  dlugosc: 8
  znak: "■"
  kolor-pelny: "&a"
  kolor-pusty: "&c"

# Nagrody za poziomy — poziom skacze sam, gdy exp dojdzie do progu; nagrody gracz odbiera w /poziom.
#  przedmioty - ustawiasz w grze: /apoziom nagroda <poziom> (wkladasz itemy, zamykasz = zapis)
#  komendy    - wykonywane z konsoli, {player} = nick gracza (bez "/")
nagrody:
  2:
    komendy: []
  3:
    komendy: []
  4:
    komendy: []
  5:
    komendy: []

gui:
  # Szklo ramki — nazwy Paper (BLACK_STAINED_GLASS_PANE, PURPLE_STAINED_GLASS_PANE, ...).
  # ramka = cala ramka, jesli nie podasz trzech ponizej.
  ramka: WHITE_STAINED_GLASS_PANE
  ramka-narozniki: YELLOW_STAINED_GLASS_PANE
  ramka-krawedzie: ORANGE_STAINED_GLASS_PANE
  ramka-reszta: WHITE_STAINED_GLASS_PANE
  tytul: "&f乂 &#C02FD4&lɴᴀɢʀᴏᴅʏ ᴢᴀ ᴘᴏᴢɪᴏᴍ &8(%strona%/%stron%)"
  info-ikona: GLOW_ITEM_FRAME
  info-nazwa: "&f乂 &#C02FD4&lᴀᴡᴀɴꜱᴇ"
  # %poziom% %exp% %cel% %pasek%
  info-lore:
    - "&f"
    - "&f 丶 ᴏᴅʙɪᴇʀᴀᴊ ɴᴀɢʀᴏᴅʏ ᴢᴀ &#C02FD4ᴘᴏᴢɪᴏᴍ ᴘᴏꜱᴛᴀᴄɪ"
    - "&f"
    - "&f 乂 ᴛᴡᴏᴊ ᴘᴏᴢɪᴏᴍ: &#C02FD4%poziom%"
    - "&f 亝 ᴇxᴘ: &#C02FD4%exp%&8/&f%cel%"
    - "&8[%pasek%&8]"
    - "&f"
    - "&f 乁 ᴊᴀᴋ ʟᴇᴡᴇʟᴏᴡᴀᴄ ᴘᴏꜱᴛᴀᴄ?"
    - "&8x &fᴡʏᴋᴏᴘᴀɴᴇ ʙʟᴏᴋɪ"
    - "&8x &fᴢᴀʙɪᴊᴀɴɪᴇ ɢʀᴀᴄᴢʏ"
    - "&f"
  nagroda-nieodebrana: CHEST_MINECART
  nagroda-odebrana: MINECART
  nagroda-nazwa: "&f乂 &#C02FD4&lɴᴀɢʀᴏᴅᴀ &f#%poziom%"
  dopisek-odebrana: " &8- &aᴏᴅᴇʙʀᴀɴᴏ"
  dopisek-do-odebrania: " &8- &eᴅᴏ ᴏᴅᴇʙʀᴀɴɪᴀ"
  dopisek-za-niski: " &8- &cᴢᴀ ɴɪꜱᴋɪ ᴘᴏᴢɪᴏᴍ"
  # %poziom% %wymagany-exp%, linia z %przedmioty% zamienia sie na liste itemow nagrody
  nagroda-lore:
    - "&f"
    - "&f 乂 ɴᴀɢʀᴏᴅᴀ ᴢᴀ ᴘᴏᴢɪᴏᴍ: &#C02FD4%poziom%"
    - "&f 亝 ᴡʏᴍᴀɢᴀɴʏ ᴇxᴘ: &#C02FD4%wymagany-exp%"
    - "&f"
    - "&f 丮 ᴘᴏ ᴏᴅᴇʙʀᴀɴɪᴜ ᴏᴛʀᴢʏᴍᴀꜱᴢ:"
    - "%przedmioty%"
    - "&f"
    - "&f 乁 &#C02FD4ᴋʟɪᴋɴɪᴊ&f, ᴀʙʏ ᴏᴅᴇʙʀᴀᴄ ɴᴀɢʀᴏᴅᴇ"
    - "&f"
  # %nazwa% %ilosc%
  prezentacja-przedmiotu: "&8x &f%nazwa% &#C02FD4x%ilosc%"
  brak-nagrod: "&8x &7ʙʀᴀᴋ ɴᴀɢʀᴏᴅ"
  poprzednia: "&f乁 &#C02FD4ᴘᴏᴘʀᴢᴇᴅɴɪᴀ ꜱᴛʀᴏɴᴀ"
  nastepna: "&f乁 &#C02FD4ɴᴀꜱᴛᴇᴘɴᴀ ꜱᴛʀᴏɴᴀ"
  edytor-tytul: "&8ɴᴀɢʀᴏᴅʏ ᴢᴀ ᴘᴏᴢɪᴏᴍ %poziom%"

wiadomosci:
  # Actionbar przy kazdym zdobytym expie (moze nachodzic na actionbar z /gornik przy kopaniu)
  actionbar-postep-wlaczony: true
  actionbar-postep: "&8[%pasek%&8] &8(&#C02FD4%exp%&8/&f%cel%&8) &#C02FD4+%dodano% ᴇxᴘ"
  awans-tytul: "&f乂 &#C02FD4&lᴀᴡᴀɴꜱ!"
  awans-podtytul: "&fᴏꜱɪᴀɢɴᴀʟᴇꜱ ᴘᴏᴢɪᴏᴍ &#C02FD4%poziom%"
  # /poziom info
  info:
    - "&8[%pasek%&8]"
    - "&8(&#C02FD4%exp%&8/&f%cel%&8)"
    - "&f乂 &#C02FD4&l%poziom% ʟᴠʟ"
  # %mnoznik% %czas%
  boost: "&f乂 &#C02FD4&lʙᴏᴏꜱᴛ ᴇxᴘᴀ &8(&#C02FD4x%mnoznik%&8) &fᴘʀᴢᴇᴢ &#C02FD4%czas%"
  odebrano-ogloszenie: "&f乂 &8| &fGracz &#C02FD4%gracz% &fodebrał nagrodę za poziom &#C02FD4&l%poziom%&f!"
  juz-odebrana: "&f乂 &#C02FD4ᴘᴏᴢɪᴏᴍʏ &8| &cOdebrałeś już tą nagrodę."
  za-niski-poziom: "&f乂 &#C02FD4ᴘᴏᴢɪᴏᴍʏ &8| &cAby odebrać tą nagrodę musisz mieć &f%poziom% &cpoziom."
  edytor-zapisano: "&f乂 &#C02FD4ᴘᴏᴢɪᴏᴍʏ &8| &aZapisano &f%ilosc% &aprzedmiotow nagrody za poziom &f%poziom%&a."
  przeladowano: "&f乂 &#C02FD4ᴘᴏᴢɪᴏᴍʏ &8| &aPrzeladowano poziomy.yml! &7(%czas%ms)"
  brak-uprawnien: "&cNie posiadasz uprawnien."
