# =========================================================
#  Event "Szal Odlamkow"
#  Kolory tekstu: kod '&' (np. &a - zielony, &c - czerwony)
#
#  IDEA DZIALANIA:
#   - Admin odpala event komenda: /eventodlamki start <sekundy>
#   - Przez caly czas trwania eventu wszystkim ONLINE graczom wyswietla sie
#     bossbar z odliczaniem (ponizej: bossbar.*)
#   - Podczas eventu, KAZDY blok wykopany W OBREBIE generatora (system
#     boniec.generatory) ma szanse-na-odlamek % szans na zadropienie
#     odlamkow (fizyczny item "Smoczy Odlamek" ustawiony przez admina
#     komenda /adminklan ustawodlamek, szablon z klany-odlamek.yml) -
#     TRAFIAJA BEZPOSREDNIO DO EKWIPUNKU gracza, ktory wykopal blok
#     (a jesli brak miejsca - upadaja pod nogi, tak jak inne dropy).
#   - Poza generatorami (zwykle kopanie w swiecie) odlamki NIE leca.
#   - Event konczy sie automatycznie po uplywie czasu (lub recznie
#     komenda /eventodlamki stop) - bossbar znika wszystkim.
# =========================================================
harmonogram:
  wlaczony: true
  # co-sekund jest IGNOROWANE. Godziny startu: eventy.yml -> eventy.szal.godziny
  co-sekund: 7200
  # Jak dlugo trwa kazdy automatycznie odpalony event (300 = 5 minut).
  czas-trwania-sekund: 300


szansa-na-odlamek:
  # Szansa w procentach (0-100) na zadropienie odlamkow z KAZDEGO wykopanego
  # bloku generatora, podczas gdy event jest aktywny.
  procent: 0.5
  # Ile sztuk odlamka dropi sie za KAZDY "trafiony" (wygrany procentowo) blok.
  ilosc: 1

bossbar:
  # Tytul bossbara - %procent% to skonfigurowana szansa na odlamek (powyzej),
  # %czas% to pozostaly czas w formacie "Xm Ys" (lub "Xs" ponizej minuty).
  tytul: "&d&lsᴢᴀʟ ᴏᴅʟᴀᴍᴋᴏᴡ &7| &fSzansa: &d%procent%% &7| &7Pozostalo: &a%czas%"
  kolor: "PINK"       # Patrz org.bukkit.boss.BarColor: PINK, BLUE, GREEN, PURPLE, RED, WHITE, YELLOW
  styl: "SOLID"        # Patrz org.bukkit.boss.BarStyle: SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
  # UWAGA: celowo bez mgly (BarFlag.CREATE_FOG) - ten sam problem co przy
  # TurboDropie (patrz kopanie.yml) - mgla na ekranie graczy jest niepozadana.

wiadomosci:
  start: "&d&lsᴢᴀʟ ᴏᴅʟᴀᴍᴋᴏᴡ &7rozpoczety! &7Kop bloki generatorow przez najblizsze &a%czas%&7, aby zlapac dodatkowe odlamki!"
  stop: "&d&lsᴢᴀʟ ᴏᴅʟᴀᴍᴋᴏᴡ &7zakonczony"
  stop-recznie: "&d&lsᴢᴀʟ ᴏᴅʟᴀᴍᴋᴏᴡ &7zostal zatrzymany przez administratora"
  juz-aktywny: "&cEvent Szal Odlamkow jest juz aktywny! Uzyj /eventodlamki stop, aby go zakonczyc wczesniej."
  nieaktywny: "&cEvent Szal Odlamkow nie jest aktualnie aktywny."
  brak-szablonu-konsola: "Gracz &2%gracz% wykopal blok generatora podczas eventu, ale szablon odlamka NIE jest ustawiony (/adminklan ustawodlamek) - nie zadropiono nic."
  gracz-otrzymal: "&d&l+%ilosc% &7Smoczych Odlamkow &7za wykopanie generatora!"
