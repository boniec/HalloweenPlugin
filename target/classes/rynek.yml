# Obslugiwane kolory: standardowe kody '&' (np. &a, &c, &l) ORAZ hex w formacie
# &#RRGGBB (np. &#FF00AA, &#C0FFEE). Kazda cyfra hex musi byc 0-9 lub A-F -
# "&#COSS" NIE zadziala, bo O i S nie sa poprawnymi cyframi szesnastkowymi.
#
# Placeholdery:
#   {cena}   - cena przedmiotu, JUZ SFORMATOWANA z kolorem. Dla ofert za pieniadze:
#              "&a$33.2k &7($33,200)" (od 1000 skrot na zielono + dokladna kwota na
#              szaro w nawiasie, ponizej 1000 sama zielona kwota, np. "&a$500").
#              Dla ofert za smocze odlamki: "&d33.2k &7(33,200)" wzgl. ponizej 1000
#              sama liczba na kolorze &d, np. "&d500" - SAMA liczba, BEZ nazwy waluty
#              (nazwe waluty dodaje osobno placeholder {waluta} nizej).
#   {limit}  - limit ofert gracza
#   {gracz}  - nick sprzedawcy
#   {przedmiot} - nazwa przedmiotu
#   {waluta} - nazwa waluty oferty (tylko w lore-oferty / lore-oferty-odlamki):
#              "Pieniądze" dla ofert za Vault, albo wartosc z gui.waluta-odlamki
#              (domyslnie "Smocze Odłamki") dla ofert za odlamki.
#   %cena%   - (tylko w lore-oferty / lore-oferty-odlamki) to samo co {cena} powyzej,
#              gdy chcesz sam ulozyc cala linie ceny zamiast uzywac {linia_ceny}.
#
# Po zmianie pliku uzyj /rynek reload (lub zrestartuj serwer).

# ==========================================================
#   WYLACZANIE HANDELU W WALUCIE (/arynek wylacz|wlacz <pieniadze|odlamki>)
# ==========================================================
# true = wystawianie ORAZ kupno ofert platnych ta waluta jest zablokowane.
# Trwajace oferty zostaja widoczne na liscie, ale nie da sie ich kupic.
# Zmieniac mozna tez komenda /arynek wylacz|wlacz (uprawnienie rynek.admin),
# ktora zapisuje te flagi tutaj - wiec nie trzeba edytowac pliku recznie.
handel:
  wylaczone:
    pieniadze: false
    odlamki: false

wiadomosci:
  # Gdy plugin ma wyzsza wersje, cala sekcja "wiadomosci" jest podmieniana
  # (kopia: rynek-gui-backup.yml). Nie zmieniaj recznie.
  wersja: 1

  # Prefix na czacie: &8[&f乣&8]  |  ikony Nexo zawsze po "&f"
  # 両 sukces  亢 ostrzezenie  与 blokada  东 czas  嗨 klik  臨/临 osoba  價 kasa  丂 anuluj
  wystawianie:
    wiadomosc:
      - "&8[&f乣&8] &f両 &aWystawiono przedmiot za {cena}"
      - "&8[&f乣&8] &f东 &7Oferta wejdzie na rynek za &e20s"
    title: "&f両 &#f1a800&lᴡʏꜱᴛᴀᴡɪᴏɴᴏ"
    subtitle: "&7Oferta pojawi się za &e20s"
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    odlamki:
      wiadomosc:
        - "&8[&f乣&8] &f両 &aWystawiono przedmiot za {cena}"
        - "&8[&f乣&8] &f东 &7Oferta wejdzie na rynek za &e20s"
      title: "&f両 &#f1a800&lᴡʏꜱᴛᴀᴡɪᴏɴᴏ"
      subtitle: "&7Oferta pojawi się za &e20s"
      sound: "ENTITY_EXPERIENCE_ORB_PICKUP"

  kupowanie:
    potwierdzenie: "&8[&f乣&8] &f亢 &eKliknij ponownie w &65s&e, aby kupić za {cena}"
    potwierdzenie-title: "&f亢 &#f1a800&lᴘᴏᴛᴡɪᴇʀᴅᴢ"
    potwierdzenie-subtitle: "&7Kliknij ponownie &8» {cena}"
    wiadomosc:
      - "&8[&f乣&8] &f両 &aZakupiono przedmiot za {cena}"
    title: "&f両 &#34e6ff&lᴢᴀᴋᴜᴘɪᴏɴᴏ"
    subtitle: "&7Zapłacono {cena}"
    sound: "ENTITY_PLAYER_LEVELUP"
    odlamki:
      wiadomosc:
        - "&8[&f乣&8] &f両 &aZakupiono przedmiot za {cena}"
      title: "&f両 &#34e6ff&lᴢᴀᴋᴜᴘɪᴏɴᴏ"
      subtitle: "&7Zapłacono {cena}"
      sound: "ENTITY_PLAYER_LEVELUP"

  sprzedaz:
    wiadomosc: "&8[&f乣&8] &f價 &aSprzedano przedmiot za {cena}"
    title: "&f價 &#f1a800&lꜱᴘʀᴢᴇᴅᴀɴᴏ"
    subtitle: "&7Otrzymano {cena}"
    sound: "ENTITY_VILLAGER_CELEBRATE"
    odlamki:
      wiadomosc: "&8[&f乣&8] &f價 &aSprzedano przedmiot za {cena} &8» &e/rynek odbierz"
      title: "&f價 &#f1a800&lꜱᴘʀᴢᴇᴅᴀɴᴏ"
      subtitle: "&7Odbierz: &e/rynek odbierz"
      sound: "ENTITY_VILLAGER_CELEBRATE"

  brak_miejsca:
    wiadomosc: "&8[&f乣&8] &f与 &eBrak miejsca &8» &7przedmiot upadł obok Ciebie"

  anulowanie:
    wiadomosc: "&8[&f乣&8] &f丂 &eAnulowano ofertę i zwrócono przedmiot"
    wiadomosc_upuszczenie: "&8[&f乣&8] &f与 &eAnulowano ofertę &8» &7brak miejsca, przedmiot upadł obok Ciebie"
    title: "&f丂 &#f1a800&lᴀɴᴜʟᴏᴡᴀɴᴏ"
    subtitle: "&7Przedmiot wrócił do Ciebie"
    sound: ""

  wygasniecie:
    wiadomosc: "&8[&f乣&8] &f东 &cTwoja oferta wygasła &8» &7przedmiot zwrócono"
    zwrot_po_wejsciu: "&8[&f乣&8] &f东 &eOferty wygasły podczas nieobecności &8» &f{ilosc} &7zwrócono"
    title: "&f东 &#FF4D4D&lᴡʏɢᴀꜱʟᴏ"
    subtitle: "&7Zwrócono: &f{ilosc}"
    sound: ""

  wlasna_oferta:
    wiadomosc: "&8[&f乣&8] &f临 &7To Twoja oferta. Anuluj ją w &eMoje oferty"

  oferta_niedostepna:
    wiadomosc: "&8[&f乣&8] &f与 &cTa oferta nie jest już dostępna"

  bledy:
    brak_przedmiotu: "&8[&f乣&8] &f亢 &cTrzymaj przedmiot w ręce, aby go wystawić"
    zla_cena: "&8[&f乣&8] &f与 &cCena musi być dodatnią liczbą"
    zla_waluta: "&8[&f乣&8] &f價 &cNa rynku płaci się tylko pieniędzmi"
    limit: "&8[&f乣&8] &f与 &cLimit ofert osiągnięty &8(&f{limit}&8)"
    brak_pieniedzy: "&8[&f乣&8] &f價 &cNie masz wystarczająco pieniędzy"
    brak_odlamkow: "&8[&f乣&8] &f價 &cNie masz wystarczająco smoczych odłamków"
    wlasny_przedmiot: "&8[&f乣&8] &f临 &cNie możesz kupić własnego przedmiotu"
    brak_economy: "&8[&f乣&8] &f与 &cEkonomia nie jest dostępna"
    uzycie: "&8[&f乣&8] &f嗨 &7Użycie: &e/rynek wystaw <cena>"
    tylko_gracze: "&8[&f乣&8] &f亢 &cTa komenda jest tylko dla graczy"
    handel_wylaczony: "&8[&f乣&8] &f与 &cHandel za {waluta} jest wyłączony"

  odbierz:
    brak: "&8[&f乣&8] &f与 &cNie masz smoczych odłamków do odebrania"
    wiadomosc:
      - "&8[&f乣&8] &f両 &aOdebrano &f{ilosc} &aSmoczych Odłamków ze sprzedaży"
    title: "&f両 &#d016f7&lᴏᴅᴇʙʀᴀɴᴏ"
    subtitle: "&7+{ilosc} smoczych odłamków"
    sound: "ENTITY_PLAYER_LEVELUP"

  reload:
    wiadomosc: "&8[&f乣&8] &f両 &aPrzeładowano konfigurację rynku"
    brak_uprawnien: "&8[&f乣&8] &f亢 &cNie masz uprawnień do tej komendy"

  resetall:
    wiadomosc: "&8[&f乣&8] &f両 &aZresetowano rynek &8» &e{ilosc} &7ofert zwrócono"
    brak_ofert: "&8[&f乣&8] &f与 &eNa rynku nie było aktywnych ofert"

  handel:
    uzycie: "&8[&f乣&8] &f嗨 &7Użycie: &e/arynek wylacz|wlacz <pieniadze|odlamki>"
    wylaczono: "&8[&f乣&8] &f与 &cWyłączono handel za &e{waluta}"
    wlaczono: "&8[&f乣&8] &f両 &aWłączono handel za &e{waluta}"

# ==========================================================
#   TEKSTY GUI (nazwy przyciskow, lore itemow na liscie)
# ==========================================================
gui:
  # Wersja wygladu. Gdy plugin ma wyzsza wersje niz ten plik, cala sekcja "gui" jest
  # automatycznie podmieniana na nowa (stara kopia: rynek-gui-backup.yml). Nie zmieniaj.
  wersja: 7

  # Tytuly okien. {strona} / {strony} = aktualna strona / liczba stron.
  tytul-rynku: "&8ʀʏɴᴇᴋ ꜱᴇʀᴡᴇʀᴏᴡʏ &8(&7{strona}&8/&7{strony}&8)"
  tytul-moje-oferty: "&8ᴍᴏᴊᴇ ᴏғᴇʀᴛʏ &8(&7{strona}&8/&7{strony}&8)"

  # Czarna ramka wokol siatki ofert (tylko glowny /rynek, "Moje oferty" sa bez szkla).
  obramowanie:
    wlaczone: true
    material: BLACK_STAINED_GLASS_PANE

  # Nazwa waluty ofert placonych smoczymi odlamkami - uzywana wszedzie tam, gdzie
  # gracz widzi cene/walute takiej oferty (lista rynku, "Moje Oferty", wiadomosci
  # czatu, tytuly, placeholder {waluta}). Pusta wartosc = domyslnie "Smocze Odłamki".
  waluta-odlamki: "Smocze Odłamki"

  # Gorny pasek = kategorie, dolny pasek = sterowanie. "opis" = linie nad lista opcji.
  przyciski:
    # Ikony Nexo: znak zawsze po "&f", zeby zachowal kolory tekstury.
    wszystko:
      nazwa: "&f乣 &a&lᴡꜱᴢʏꜱᴛᴋᴏ"
      opis:
        - "&7Oferty ze wszystkich kategorii."
    narzedzia:
      nazwa: "&f乚 &b&lɴᴀʀᴢęᴅᴢɪᴀ"
      opis:
        - "&7Bronie, siekiery i łopaty."
    uzbrojenie:
      nazwa: "&f世 &#34e6ff&lᴜᴢʙʀᴏᴊᴇɴɪᴇ"
      opis:
        - "&7Zbroje i elytry."
    specjalne:
      nazwa: "&f乜 &d&lꜱᴘᴇᴄᴊᴀʟɴᴇ"
      opis:
        - "&7Mistyczne, eventowe, kostiumy,"
        - "&7kamienie i aury."
    premium:
      nazwa: "&f亗 &#d016f7&lᴘʀᴇᴍɪᴜᴍ"
      opis:
        - "&7Odłamki, klucze, LuckyBlocki"
        - "&7i vouchery."
    # {wystawione} / {limit} = ile ofert masz na rynku / ile mozesz miec
    twoje:
      nazwa: "&f临 &#f1a800&lᴍᴏᴊᴇ ᴏғᴇʀᴛʏ"
      lore:
        - ""
        - "&f亞 &7Wystawione: &f{wystawione}&8/&f{limit}"
        - ""
        - "&f嗨 &eLPM &8» &7zarządzaj ofertami"
    jak_wystawic:
      nazwa: "&f亞 &6&lᴊᴀᴋ ᴡʏꜱᴛᴀᴡɪć?"
      lore:
        - ""
        - "&f1. &7Weź przedmiot do ręki"
        - "&f2. &7Wpisz &e/rynek wystaw <cena>"
        - "&f3. &7Oferta pojawi się po &a20s"
        - ""
        - "&f东 &7Oferty wygasają po &f7 dniach&7."
        - "&7Płatność tylko &apieniędzmi&7."
    filtrowanie:
      nazwa: "&f中 &b&lꜰɪʟᴛʀ ᴄᴇɴʏ"
      wszystkie: "Wszystkie oferty"
      stac_mnie: "Tylko na które mnie stać"
    sortowanie:
      nazwa: "&f事 &5&lꜱᴏʀᴛᴏᴡᴀɴɪᴇ"
    # Strzalki stron - zawsze widoczne (szare, gdy nie ma kolejnej strony).
    poprzednia_strona: "&f丂 &a&lᴘᴏᴘʀᴢᴇᴅɴɪᴀ"
    poprzednia_strona_nieaktywna: "&7丂 ᴘᴏᴘʀᴢᴇᴅɴɪᴀ"
    poprzednia_strona_lore:
      - "&7Przejdź na stronę &f{strona}&8/&f{strony}"
    poprzednia_strona_lore_nieaktywna:
      - "&8To już pierwsza strona"
    nastepna_strona: "&a&lɴᴀꜱᴛęᴘɴᴀ &f亞"
    nastepna_strona_nieaktywna: "&7ɴᴀꜱᴛęᴘɴᴀ 亞"
    nastepna_strona_lore:
      - "&7Przejdź na stronę &f{strona}&8/&f{strony}"
    nastepna_strona_lore_nieaktywna:
      - "&8To już ostatnia strona"
    strona:
      nazwa: "&f{strona}&8/&f{strony}"
      lore:
        - "&7Aktualna strona rynku"
        - "&8Oferty: 28 na stronę"
    powrot: "&f丂 &c&lᴘᴏᴡʀóᴛ"
    powrot_lore:
      - "&7Wróć do rynku"
    # Pokazywane na srodku, gdy na liscie nic nie ma.
    pusto:
      nazwa: "&f与 &7&lʙʀᴀᴋ ᴏғᴇʀᴛ"
      lore:
        - "&7Nic tu nie ma dla tych filtrów."
        - "&7Zmień kategorię albo wystaw coś sam!"
    pusto_moje:
      nazwa: "&f与 &7&lɴɪᴇ ᴍᴀꜱᴢ ᴏғᴇʀᴛ"
      lore:
        - "&7Wystaw przedmiot: &e/rynek wystaw <cena>"
    # Naglowek w "Moje oferty" ({wystawione} / {limit}).
    info_moje:
      nazwa: "&f临 &#f1a800&lᴛᴡᴏᴊᴇ ᴏғᴇʀᴛʏ"
      lore:
        - ""
        - "&f亞 &7Wystawione: &f{wystawione}&8/&f{limit}"
        - "&f嗨 &7Kliknij ofertę, aby ją &canulować&7."

  # Wyglad opcji w lore (kategorie, waluta, filtr, sortowanie).
  opcja-prefix: " "
  opcja-aktywna: "&f両 &a"
  opcja-nieaktywna: "&8▪ &7"
  klik-przelacz: "&f嗨 &eLPM &8» &7przełącz"
  klik-pokaz: "&f嗨 &eLPM &8» &7pokaż wszystko"

  # Dopisywane do oferty po pierwszym kliknieciu (drugie klikniecie w 5s = zakup).
  potwierdz-lore:
    - ""
    - "&f亢 &e&lKliknij ponownie, aby kupić!"

  # Nazwy podkategorii (klucze odpowiadaja categories.yml). "calosc" = cala kategoria naraz.
  podkategorie:
    calosc: "Cała kategoria"
    # Narzedzia
    bronie: "Bronie"
    siekiery: "Siekiery"
    lopaty: "Łopaty"
    # Uzbrojenie
    helmy: "Głowki"
    napiersniki: "Napierśniki"
    spodnie: "Spodnie"
    buty: "Buty"
    elytry: "Elytry"
    # Specjalne
    mistyczne: "Mistyczne"
    eventowe: "Eventowe"
    kostiumy: "Kostiumy"
    kamienie: "Kamienie"
    aury: "Aury"
    # Premium
    odlamki: "Odłamki"
    klucze: "Klucze"
    luckyblocki: "LuckyBlocki"
    vouchery: "Vouchery"

  sortowanie:
    DATE_ASC: "Rosnąca Data"
    DATE_DESC: "Malejąca Data"
    PRICE_ASC: "Rosnąca Cena"
    PRICE_DESC: "Malejąca Cena"

  # Dopisywane na koncu lore kazdego przedmiotu na glownej liscie rynku.
  # Dziala dla ofert zaplacoych PIENIADZMI (Vault). Dla ofert za smocze odlamki
  # uzywana jest sekcja "lore-oferty-odlamki" ponizej (jesli jest ustawiona).
  # {wygasa} = czas do wygasniecia oferty.
  lore-oferty:
    - ""
    - "&8&m                         "
    - " &f临 &7Sprzedawca &8» &f{gracz}"
    - " {linia_ceny}"
    - " &f东 &7Wygasa za &8» &f{wygasa}"
    - "&8&m                         "
    - " &f嗨 &aLPM &8» &7kup przedmiot"

  # Osobne lore TYLKO dla ofert wystawionych za smocze odlamki (waluta "odlamki").
  # Jesli zostawisz ta liste pusta ([]), oferty za odlamki beda uzywac zwyklego
  # "lore-oferty" powyzej (tak jak dotychczas) - ta sekcja jest w pelni opcjonalna.
  # Dostepne placeholdery: {gracz}, {linia_ceny}, {waluta} (nazwa waluty oferty,
  # np. "Smocze Odłamki" - patrz gui.waluta-odlamki nizej).
  lore-oferty-odlamki:
    - ""
    - "&8&m                         "
    - " &f临 &7Sprzedawca &8» &f{gracz}"
    - " &f中 &7Cena &8» %cena% &d{waluta}"
    - " &f东 &7Wygasa za &8» &f{wygasa}"
    - "&8&m                         "
    - " &f嗨 &aLPM &8» &7kup przedmiot"
  # %cena% = juz sformatowana cena z kolorem (od 1000 skrot + dokladna kwota w nawiasie,
  # np. "&b33.2k &7(33,200 Smocze Odłamki)"). Uzywaj %cena% gdy chcesz sam ulozyc
  # cala linie ceny (jak wyzej); {linia_ceny} nizej to gotowa, oddzielna linia z
  # etykieta "Cena" - wybierz jedno z dwoch podejsc, nie musisz uzywac obu naraz.
  # {cena_krotka} = juz sformatowana cena z kolorem, od 1000 z dokladna kwota w nawiasie
  # (dla pieniedzy: "&a$33.2k &7($33,200)", dla odlamkow: "&d33.2k &7(33,200)" - sama
  # liczba, bez nazwy waluty). Zmieniasz tu tylko etykiete "Cena" - ta sama linia jest
  # uzywana dla obu walut.
  linia-ceny: "&f中 &7Cena &8» {cena_krotka}"

  # Dopisywane na koncu lore kazdego przedmiotu w "Moje Oferty" ({cena}, {wygasa}).
  lore-moja-oferta:
    - ""
    - "&8&m                         "
    - " &f中 &7Cena &8» {cena}"
    - " &f东 &7Wygasa za &8» &f{wygasa}"
    - "&8&m                         "
    - " &f嗨 &cLPM &8» &7anuluj i odbierz przedmiot"

