# ==========================================================
#   NEKROMANTA - wymiana glutow na losowe miecze
#   Gracz:  /nekromanta                  - otwiera menu wymiany
#           LPM na pakiecie = wymiana, PPM = podglad nagrod i szans
#           Wplata glutow (przycisk w menu): LPM = wplac ilosc z 'wplata.ilosc-lpm', PPM = wplac wszystkie.
#           Wplacone gluty to SALDO - saldo + EQ licza sie przy wymianie pakietow; za saldo tez kupuje sie ULEPSZENIA.
#           Ulepszenia zwiekszaja szanse dropu GLUTA z welny (wpisy /awelna, ktore sa glutem).
#   Admin (permisja nekromanta.admin):  /anekromanta
#     dodaj <100|200|300> <szansa%>      - item z reki jako mozliwa nagroda
#     usun <pakiet> <numer>
#     szansa <pakiet> <numer> <szansa%>
#     lista [pakiet]
#     glut [gracz] [ilosc]               - wydaje item gluta
#     ustawglut [reset]                  - item z reki staje sie glutem (reset = glut z tego pliku)
#     saldo <gracz> [ustaw|dodaj <ilosc>] / poziom <gracz> [ustaw <n>]  - podglad i edycja salda/poziomu
#     reload
#   Nagrody, salda, poziomy i szablon gluta sa w nekromanta.db (SQLite).
#   Ten plik to tylko konfiguracja (teksty, tiery, dzwieki). Nie edytuj bazy recznie — uzywaj komend.
#
#   Szanse: losowanie jest WAZONE. Jesli suma szans w pakiecie to 100% - to sa dokladne
#   procenty. Jesli suma jest inna, szanse sa przeliczane proporcjonalnie (pokazuja sie w menu).
#   Kolory: &#RRGGBB lub &x&R&R&G&G&B&B. Ikony Nexo: wklej znak bezposrednio.
# ==========================================================


# Domyslny item gluta (uzywany, dopoki nie zrobisz /anekromanta ustawglut - wtedy wygrywa item z nekromanta.db).
