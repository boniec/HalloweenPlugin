# =========================================================
#  Odlamki - Event "Szal Odlamkow"
#
#  Ten plik trzyma WYLACZNIE wartosci samego dropu odlamkow podczas eventu
#  (ile sztuk leci za jeden "trafiony" blok generatora). Sam WYGLAD/NBT
#  odlamka (nazwa, lore, custom model data) to OSOBNY szablon ustawiany
#  komenda /adminklan ustawodlamek i trzymany w klany-odlamek.yml - tutaj
#  NIC z wygladem itemu sie nie configuruje.
#
#  Bossbar i szansa procentowa na odlamek (per wykopany blok) sa w
#  eventodlamki.yml - tutaj wylacznie ILOSC sztuk.
# =========================================================

drop:
  # Ile sztuk odlamka (fizycznego itemu wg szablonu z klany-odlamek.yml)
  # dropi sie za KAZDY "trafiony" blok generatora podczas eventu.
  ilosc-za-blok: 1
