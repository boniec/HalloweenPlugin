wiadomosci:
  brak-uprawnien: "&cBrak uprawnien."
  uzycie: "&cUzycie: &e/azbroja nazwa <tekst...> &7| &e/azbroja reload"
  nazwa-za-krotka: "&cPodaj nazwe, np. &emiecz chewbacci 1"
  zastosowano: "&aUstawiono nazwe (+ &6★&anumer) na &f{ilosc} &aprzedm. (zbroja + rece)."
  brak-itemu: "&cZaloz cos w zbroje lub trzymaj przedmiot w rece."
  skopiowano: "&aWyslano nazwe na czat — kliknij, aby skopiowac."
