# Kreator nazw setow / zbroi (/azbroja)
# Nazwa BEZ ikon z texture packa — tylko gradient + numer + gwiazdka ★

domyslny-hex-od: "#555555"
domyslny-hex-do: "#BBBBBB"
domyslny-hex-barwnik: "#8B6914"

# Numer seta na koncu (★ przed numerem, zwykla gwiazdka)
format-numeru: "&6★&6&l%numer%"

gui:
  tytul: "&8ᴋʀᴇᴀᴛᴏʀ &7%tekst% &8(%strona%/%max%)"
