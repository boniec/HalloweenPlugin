# Sklep eventowy — normalne itemy (klucze, narzedzia, kosmetyki) za wartosc cukierkow w worku.
# Cena = suma pol value cukierkow (nie liczba sztuk).
#
# STANDARD (klucz / item do eq):
#   nazwa, material, amount, lore, cena, limit, slot
#   → gracz dostaje ten przedmiot do inventory (chyba ze ustawisz daj-przedmiot: false).
#
# KLUCZ z pluginu skrzynek (tylko komenda, ikona w GUI):
#   daj-przedmiot: false
#   komendy:
#     - "twojaKomenda key give %player% halloween 1"
#
# Item z Nexo: nexo: "id_z_nexo.yml"
# Wiele itemow naraz: sekcja daj: { klucz1: { material: ... }, ... }
#
# Opcjonalnie (rzadko): grant: = cukierki do worka | crate: true = losowka cukierkow do worka
shop:
  klucz_halloween:
    slot: 11
    nazwa: "&#FF7518klucz halloween"
    opis: "Otwiera skrzynke eventowa."
    material: TRIPWIRE_HOOK
    amount: 1
    cena: 55
    limit: 20
    daj-przedmiot: false
    komendy:
      - "crates key give %player% halloween 1"
  klucz_rzadki:
    slot: 12
    nazwa: "&#9B30FFklucz rzadki"
    opis: "Lepsza skrzynka — podmien komende."
    material: TRIPWIRE_HOOK
    amount: 1
    cena: 120
    limit: 8
    daj-przedmiot: false
    komendy:
      - "crates key give %player% halloween_rare 1"
  glowa_dyni:
    slot: 14
    nazwa: "&fꔰ &#FF7518glowa dyni"
    opis: "Item do eq — kolekcjonerska glowka."
    material: JACK_O_LANTERN
    amount: 1
    cena: 160
    limit: 3
  tytul:
    slot: 16
    nazwa: "&#9B30FFtytul duch nocy"
    opis: "Tylko komenda — bez itemu w eq."
    material: NAME_TAG
    amount: 1
    cena: 320
    limit: 1
    daj-przedmiot: false
    komendy:
      - "lp user %player% meta set suffix &#9B30FF duch nocy"
  # klucz jako fizyczny item (bez pluginu) — wystarczy material, bez komend:
  # klucz_item:
  #   slot: 20
  #   nazwa: "&#FF7518klucz"
  #   material: TRIPWIRE_HOOK
  #   amount: 1
  #   cena: 40
  #   limit: 10
