# =========================================================
#  Konfiguracja pluginu Inventory (system kitów + kradzież ekwipunku)
#  Kolory tekstu: kod '&' (np. &a - zielony, &c - czerwony, &8 - ciemnoszary)
#  Po zmianach użyj: /adminkit reload
#
#  WAŻNE - zasady YAML (jeśli wiadomości "nie działają", to zwykle stąd):
#   - wcięcia TYLKO spacjami, nigdy tabulatorem (TAB psuje cały plik)
#   - jeśli tekst zawiera dwukropek ":" - MUSI być w cudzysłowie, np.
#       no-permission: "Brak uprawnień: sprawdź rangę"
#   - /adminkit reload teraz sam sprawdza plik i wypisze błąd (z powodem),
#     jeśli coś jest nie tak ze składnią - czytaj komunikat w chacie/konsoli
# =========================================================

# ---------------------------------------------------------
#  FORMAT CZATU
#  Placeholdery: %player% (nick), %displayname%, %message% (tresc),
#  PlaceholderAPI (np. %luckperms_prefix%) oraz relacyjne %rel_...%
#  (np. %rel_klany_rel_klan_tag% — tag klanu w kolorze wzgledem odbiorcy).
#  Kolory: &a, &f, ... oraz hex &#RRGGBB.
#  color-permission - kto moze uzywac kolorow (&) w swoich wiadomosciach
#  (pusty tekst "" = nikt). Zmiany: /adminkit reload
# ---------------------------------------------------------
chat-format:
  enabled: true
  format: "%rel_klany_rel_klan_tag% %luckperms_prefix%&f%player% &8» &f%message%"
  color-permission: "chat.color"

# /chat clear | off | on  (permisja chat.admin)
# chat.bypass — pisze mimo wylaczonego czatu
chat:
  lock:
    clear-linie: 120
    uzycie: "&7Uzycie: &f/chat clear &7| &f/chat off &7| &f/chat on"
    brak-permisji: "&cNie masz uprawnien!"
    wylaczony-info: "&cCzat jest obecnie wylaczony."
    juz-wylaczony: "&eCzat jest juz wylaczony."
    juz-wlaczony: "&eCzat jest juz wlaczony."
    wylaczono: "&cCzat zostal wylaczony przez &f%gracz%&c."
    wlaczono: "&aCzat zostal wlaczony przez &f%gracz%&a."
    wyczyszczono: "&eCzat zostal wyczyszczony przez &f%gracz%&e."

gui:
  # Rozmiar GUI z listą kitów oraz podglądu (musi być wielokrotnością 9, max 54)
  size: 45

  titles:
    kit-list: '&8Zestawy'
    admin-list: '&4Admin: &8Wybierz zestaw'
    preview-prefix: '&8Podgląd: '
    edit-prefix: '&4Edycja: &8'
    actions-prefix: '&4Zarządzaj: &8'

  # Dekoracyjne szkło wypełniające puste sloty w GUI (kit-list oraz preview)
  decorations:
    enabled: true
    orange-glass-slots:
      - 0
      - 8
      - 36
      - 44
    yellow-glass-slots:
      - 1
      - 7
      - 9
      - 17
      - 27
      - 35
      - 37
      - 43
    white-glass-slots:
      - 2
      - 3
      - 5
      - 6
      - 18
      - 26
      - 38
      - 39
      - 41
      - 42

database:
  # Nazwa pliku bazy danych SQLite (przechowywanej w folderze pluginu)
  file: kity.db

messages:
  prefix: '&8[&aKity&8] &r'
  players-only: '&cTa komenda jest dostępna tylko dla graczy!'
  no-permission: '&cNie masz uprawnień do tej komendy!'
  db-error: '&cWystąpił błąd bazy danych — spróbuj ponownie za chwilę lub zgłoś to
    administracji.'
  kit-received: '&aOtrzymano zestaw: &f%kit%'
  # %permission% pokazuje graczowi/adminowi DOKŁADNĄ permisję wymaganą do kitu -
  # bardzo pomocne przy diagnozowaniu literówek/wielkości liter w permisjach.
  kit-no-permission: '&cNie masz uprawnień do tego zestawu! &7(%permission%)'
  kit-cooldown: '&cMusisz poczekać jeszcze: &f%time%'
  kit-created: '&aUtworzono zestaw &f%kit%'
  kit-deleted: '&cUsunięto zestaw &f%kit%'
  kit-disabled: '&cTen zestaw jest obecnie wylaczony.'
  kit-enabled: '&aWlaczono zestaw &f%kit%'
  kit-turned-off: '&cWylaczono zestaw &f%kit%'
  kit-updated-items: '&aZaktualizowano przedmioty i ikonę zestawu &f%kit%'
  config-reloaded: '&aPrzeładowano config.yml oraz kity.yml'
  usage-adminkit: '&cUżycie: /adminkit create <nazwa> <cooldown> <permisja> <slot>
    | edit <nazwa> | reload'
  invalid-number: '&cCooldown i slot muszą być liczbami!'
  edit-set-cooldown: '&eWpisz nowy cooldown w sekundach na czacie:'
  edit-set-permission: '&eWpisz nową permisję na czacie (lub ''none''):'
  edit-set-slot: '&eWpisz nowy numer slotu (0-44) na czacie:'
  edit-set-lore: '&eWpisz linijki lore na czacie oddzielone znakiem "|" (lub "brak"
    aby usunąć):'
  edit-success-cooldown: '&aUstawiono cooldown na %value%s.'
  edit-success-permission: '&aUstawiono permisję na %value%'
  edit-success-slot: '&aUstawiono slot na %value%'
  edit-success-lore: '&aZaktualizowano lore kitu %kit%'
  edit-error: '&cBłąd: %error%'
