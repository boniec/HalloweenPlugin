# Ustawienia MySQL (tylko gdy databaseType: MYSQL)
mysql:
  port: 3306
  host: localhost
  database: shop
  tablePrefix: shop_
  password: password
  username: root
# Czy wysylac powiadomienia o nowych wersjach pluginu
updateChecker: true
# Czy debug mode wlaczony
debug: false
# Typ bazy danych: SQLITE lub MYSQL
databaseType: SQLITE
