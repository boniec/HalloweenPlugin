# Definicje materialow przypisanych do poszczegolnych (pod)kategorii rynku.
# Uzywane przez boniec.rynek.Rynek#isMaterialInCategory - klucze musza
# odpowiadac sciezkom uzywanym w kodzie:
#   narzedzia.<sub>, uzbrojenie.<sub>, specjalne.<sub>, premium.<sub>
#
# Filtrowanie odbywa sie po TYPIE materialu (nie po nazwie/lore itemu), wiec
# kazdy przedmiot danego typu trafi do tej kategorii. "Wszystkie" w danej
# kategorii = suma wszystkich jej podkategorii.

narzedzia:
  bronie:
    - WOODEN_SWORD
    - STONE_SWORD
    - IRON_SWORD
    - GOLDEN_SWORD
    - DIAMOND_SWORD
    - NETHERITE_SWORD
    - BOW
    - CROSSBOW
    - TRIDENT
    - MACE
  siekiery:
    - WOODEN_AXE
    - STONE_AXE
    - IRON_AXE
    - GOLDEN_AXE
    - DIAMOND_AXE
    - NETHERITE_AXE
  lopaty:
    - WOODEN_SHOVEL
    - STONE_SHOVEL
    - IRON_SHOVEL
    - GOLDEN_SHOVEL
    - DIAMOND_SHOVEL
    - NETHERITE_SHOVEL

uzbrojenie:
  helmy:
    - PLAYER_HEAD
  napiersniki:
    - LEATHER_CHESTPLATE
    - CHAINMAIL_CHESTPLATE
    - IRON_CHESTPLATE
    - GOLDEN_CHESTPLATE
    - DIAMOND_CHESTPLATE
    - NETHERITE_CHESTPLATE
  spodnie:
    - LEATHER_LEGGINGS
    - CHAINMAIL_LEGGINGS
    - IRON_LEGGINGS
    - GOLDEN_LEGGINGS
    - DIAMOND_LEGGINGS
    - NETHERITE_LEGGINGS
  buty:
    - LEATHER_BOOTS
    - CHAINMAIL_BOOTS
    - IRON_BOOTS
    - GOLDEN_BOOTS
    - DIAMOND_BOOTS
    - NETHERITE_BOOTS
  elytry:
    - ELYTRA

# ----------------------------------------------------------------------
# SPECJALNE i PREMIUM - UWAGA: wpisz tu materialy swoich przedmiotow.
# Dopoki lista podkategorii jest pusta, podkategoria bedzie pokazywac
# pusta liste ofert (rynek filtruje po TYPIE materialu, nie po nazwie/lore).
# Przyklad (kazdy material moze byc tylko w jednej podkategorii, inaczej
# przedmiot pokaze sie w kilku):
#   premium:
#     odlamki:
#       - DRAGON_BREATH
#     klucze:
#       - TRIPWIRE_HOOK
# Wpisuj materialy wielkimi literami, jak w Bukkit Material.
# ----------------------------------------------------------------------
specjalne:
  mistyczne:
    - STICK
    - HONEYCOMB
    - FERMENTED_SPIDER_EYE
    - ENCHANTED_GOLDEN_APPLE
    - LANTERN
  eventowe:
    - STICK
    - HONEYCOMB
    - FERMENTED_SPIDER_EYE
    - ENCHANTED_GOLDEN_APPLE
    - LANTERN
  kostiumy: []
  kamienie:
    - RED_CONCRETE
    - LIGHT_BLUE_CONCRETE
    - YELLOW_CONCRETE
    - LIME_CONCRETE
  aury: []

premium:
  odlamki:
    - PRISMARINE_SHARD
  klucze: []
  luckyblocki:
    - SPONGE
  vouchery: []