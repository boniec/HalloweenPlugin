# =========================================================
#  Nagroda za Discorda  (/nagroda)
#
#  Jak to dziala:
#   1) Gracz wpisuje /nagroda i dostaje w grze jednorazowy kod.
#   2) Na kanale Discord bot trzyma embed z przyciskiem. Klik -> formularz (nick + kod).
#   3) Zgodny nick + kod => z konsoli leca komendy nagrody, na czacie broadcast,
#      a osobie na Discordzie zmienia sie nick na nick z Minecrafta.
#
#  Konfiguracja bota (https://discord.com/developers/applications):
#   - Bot -> skopiuj TOKEN i wklej nizej. Zadne "Privileged Intents" nie sa potrzebne.
#   - Zaproszenie bota na serwer (OAuth2 -> URL Generator): scope "bot",
#     uprawnienia: Wyswietlanie kanalow, Wysylanie wiadomosci, Osadzanie linkow,
#     Zarzadzanie pseudonimami.
#   - Zeby bot mogl zmieniac nicki, jego ROLA musi byc WYZEJ niz role osob.
#     Wlasciciela serwera Discord nie da sie przezwac (ogranicznik Discorda).
#
#  Po zmianach: /nagroda reload (uprawnienie nagroda.admin).
#  Embed wysyla sie sam przy pierwszym starcie; /nagroda embed wysyla go ponownie
#  (stara wiadomosc jest usuwana).
#  Kolory w grze: kod '&'. Wiadomosci na Discordzie: markdown Discorda.
# =========================================================

discord:
  # Wlacz po wpisaniu tokena i ID kanalu.
  wlaczony: false
  token: "WKLEJ_TOKEN_BOTA"
  # ID kanalu tekstowego, na ktory bot wysle embed (Discord -> prawy klik na kanal -> Kopiuj ID;
  # wymaga wlaczonego Trybu dewelopera w ustawieniach Discorda).
  kanal-id: ""
  # Link wysylany graczowi - linia z tym adresem w wiadomosci z kodem jest KLIKALNA.
  link: "https://discord.gg/gzibmc"
  # Wyslij embed automatycznie przy pierwszym starcie bota.
  auto-embed: true
  # Zmieniaj nick osoby na Discordzie po odebraniu nagrody.
  zmien-nick: true
  # Format nicku (%player% = nick z Minecrafta).
  nick-format: "%player%"

kod:
  dlugosc: 6
  # Po ilu minutach kod wygasa.
  wazny-minuty: 15

# ZASADA: MAX 1 POLACZONE KONTO - jedno konto Discord moze byc polaczone z jednym nickiem
# z Minecrafta i odwrotnie (jeden nick = jedno konto Discord). Nagrode dostaje sie przy
# polaczeniu, wiec kazdy odbiera ja tylko raz. Polaczenia sa w SQLite (nagroda.db).
# Zdjecie polaczenia (np. zmiana konta Discord): /nagroda odlacz <nick>.
nagrody:
  # true = gracz musi byc online, zeby odebrac nagrode (potrzebne np. dla komend give).
  # false = dziala tez offline (wystarczy dla komend typu LuckPerms).
  wymagaj-online: false
  # Komendy wykonywane z KONSOLI. %player% = nick, %uuid% = UUID gracza.
  komendy:
    - "lp user %player% parent add vip"
    # - "give %player% diamond 16"
    # - "eco give %player% 5000"

# Wyglad embeda na kanale Discord.
embed:
  tytul: "🎁 Nagroda za dołączenie na Discorda"
  opis:
    - "Odbierz swoją nagrodę w trzech krokach:"
    - ""
    - "**1.** Wpisz na serwerze komendę **/nagroda**"
    - "**2.** Kliknij przycisk **Odbierz nagrodę** poniżej"
    - "**3.** Podaj swój **nick** i **kod** z gry"
  kolor: "#5865F2"
  stopka: "discord.gg/gzibmc"
  miniatura: ""
  obrazek: ""
  przycisk:
    tekst: "Odbierz nagrodę"
    emoji: "🎁"
    # PRIMARY (niebieski), SECONDARY (szary), SUCCESS (zielony), DANGER (czerwony)
    styl: SUCCESS

# Formularz po kliknieciu przycisku.
modal:
  tytul: "Odbierz nagrodę"
  nick-etykieta: "Twój nick z Minecrafta"
  nick-placeholder: "np. Steve"
  kod-etykieta: "Kod weryfikacyjny"
  kod-placeholder: "kod z komendy /nagroda"

# Wiadomosci w grze (kolory '&'). Puste linie ('') sa zachowane.
wiadomosci:
  # Wiadomosc z kodem (%kod%). Linia zawierajaca adres z discord.link jest klikalna.
  kod:
    - ""
    - "&fTwoj weryfikacyjny kod: &c%kod%"
    - ""
    - "&4discord.gg/gzibmc"
    - ""
  hover-link: "&7Kliknij, aby dołączyć na Discorda"
  # Broadcast na czacie, gdy ktos odbierze nagrode (%player%).
  broadcast:
    - ""
    - "&8» &6%player% &7odebrał nagrodę za dołączenie na &9Discorda&7! &8(&fdiscord.gg/gzibmc&8)"
    - ""
  juz-odebrano: "&cJuż odebrałeś nagrodę za Discorda."
  discord-wylaczony: "&cOdbieranie nagrody przez Discorda jest teraz niedostępne."

# Odpowiedzi bota na Discordzie (widoczne tylko dla osoby, ktora kliknela).
odpowiedzi:
  sukces: "✅ Nagroda dla **%player%** została odebrana! Sprawdź serwer."
  bledny-kod: "❌ Nieprawidłowy lub wygasły kod. Wpisz **/nagroda** na serwerze, aby dostać nowy."
  bledny-nick: "❌ Ten kod nie należy do podanego nicku."
  # %player% = nick MC, z ktorym to konto Discord jest juz polaczone
  juz-odebrano-dc: "❌ To konto Discord ma już połączone konto Minecraft: **%player%**."
  juz-odebrano-mc: "❌ Ten nick jest już połączony z innym kontem Discord."
  gracz-offline: "❌ Musisz być online na serwerze, aby odebrać nagrodę."
