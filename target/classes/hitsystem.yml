# =========================================================
#  Konfiguracja systemu hitow / obrazen setowych (HitSystem)
#  Kolory tekstu: kod '&' (np. &a - zielony, &c - czerwony)
#  Po zmianach uzyj: /hitsystem reload
#
#  MODEL (te same itemy / parytet setow):
#   - Elytra zamiast klaty: 2.54 serca (zwykly hit) / 3.01 serca (crit).
#   - Klata (pelna zbroja): 30% MNIEJ niz elytra -> 1.778 / 2.107.
#     (elytra = klata * 1.42857, bo 30% mniej na klacie to klata = 70% elytry)
#   - Kazdy poziom przewagi/straty seta zmienia obrazenia o set-difference.per-level
#     (0.25). Przyklady (zwykly hit, KLATA, bez perkow):
#       miecz 12 vs zbroja 12 = 1.778     miecz 16 vs zbroja 16 = 1.778
#       miecz 12 vs zbroja 16 = 1.278     miecz 16 vs zbroja 12 = 2.278
#   - Wartosci w set-damage podajemy w SERCACH (1 serce = 2.0 pkt HP).
#   - Numer seta: miecz = (Sharpness - 1) / 2, zbroja = Protection / 2
#     (zbroja liczy sie tylko jako KOMPLET 4 elementow o tym samym poziomie).
# =========================================================

elytra-as-chestplate:
  enabled: true
  # extra-hearts != 0 nadpisuje procent. 0 = uzywamy damage-percent.
  # 42.857...% wiecej na elytrze = klata bierze dokladnie 30% mniej niz elytra.
  #   klata 1.778 * 1.42857 = 2.54   |   klata 2.107 * 1.42857 = 3.01
  damage-percent: 42.857142857
  extra-hearts: 0.0
missing-armor-penalty:
  enabled: true
  extra-damage-percent: 25
damage-system:
  enabled: true

debug:
  enabled: false

scope:
  pvp-melee-only: true
  
  

# Brak pelnego seta / miecza z Sharpness = traktowany jak set 0.
# UWAGA: przy tym modelu to daje duza przewage atakujacemu (np. miecz 13 vs
# niepelna zbroja = zbroja 0 -> +13 poziomow roznicy, ucieta przez max-bonus).
no-set-behavior:
  mode: fallback-set
  fallback-attacker-set: 0
  fallback-defender-set: 0

# Baza obrazen (w sercach) jest TAKA SAMA dla kazdego seta - o sile decyduje
# dopiero roznica setow (set-difference nizej).
# normal   = zwykly hit (klata: 1.778 = 70% z 2.54 na elytrze)
# critical = critical hit (klata: 2.107 = 70% z 3.01 na elytrze)
set-damage:
  '0':
    normal: 1.778
    critical: 2.107
  '1':
    normal: 1.778
    critical: 2.107
  '2':
    normal: 1.778
    critical: 2.107
  '3':
    normal: 1.778
    critical: 2.107
  '4':
    normal: 1.778
    critical: 2.107
  '5':
    normal: 1.778
    critical: 2.107
  '6':
    normal: 1.778
    critical: 2.107
  '7':
    normal: 1.778
    critical: 2.107
  '8':
    normal: 1.778
    critical: 2.107
  '9':
    normal: 1.778
    critical: 2.107
  '10':
    normal: 1.778
    critical: 2.107
  '11':
    normal: 1.778
    critical: 2.107
  '12':
    normal: 1.778
    critical: 2.107
  '13':
    normal: 1.778
    critical: 2.107
  '14':
    normal: 1.778
    critical: 2.107
  '15':
    normal: 1.778
    critical: 2.107
  '16':
    normal: 1.778
    critical: 2.107
  '17':
    normal: 1.778
    critical: 2.107
  '18':
    normal: 1.778
    critical: 2.107
  '19':
    normal: 1.778
    critical: 2.107
  '20':
    normal: 1.778
    critical: 2.107

# Uzywane tylko dla setow spoza tabeli powyzej (np. 21+). Przyrost 0 = tak samo
# jak w tabeli (plaska baza).
default-scaling:
  base-normal: 1.778
  base-critical: 2.107
  per-set-increment-normal: 0.0
  per-set-increment-critical: 0.0

# final = baza + (set atakujacego - set obroncy) * per-level, ograniczone do
# [min-bonus, max-bonus] (w sercach). Baza (1.778 na klacie) jest zawsze przy roznicy = 0
# (ten sam set / parytet), per-level lagodnie skaluje w gore/w dol od tego punktu.
#   per-level 0.25, przyklady vs zbroja set 18 (prot 36), KLATA:
#     set 17 (sharp 35, roznica -1) = 1.778 - 1*0.25 = 1.528
#     set 16 (sharp 33, roznica -2) = 1.778 - 2*0.25 = 1.278
#     set 15 (sharp 31, roznica -3) = 1.778 - 3*0.25 = 1.028
#     set 14 (sharp 29, roznica -4) = 1.778 - 4*0.25 = 0.778
#     set 18 (sharp 37, roznica  0) = 1.778              (parytet, pelny hit)
#   Przy jeszcze wiekszej przewadze zbroi (roznica -7 i mocniej) formula
#   zjezdzalaby ponizej limits.min-damage-hearts (0.5) - wtedy po prostu scina
#   sie do tych 0.5 serca (twardy floor), zamiast schodzic w minus.
#   max/min-bonus +-2.0 -> po tej roznicy (2.0/0.25 = 8 poziomow) sam bonus juz
#   sie nie powieksza, ale i tak w praktyce wczesniej scina to limits powyzej.
set-difference:
  enabled: true
  per-level: 0.25
  max-bonus: 2.0
  min-bonus: -2.0

# W formule liczy sie set MIECZA (zbroja atakujacego jest ignorowana).
sword:
  use-sword-set-in-formula: true
  mismatch-mode: sword-only # "lower" | "sword-only" | "armor-only"

# Twarde limity koncowego obrazenia (w sercach) - przed global-hits.
limits:
  min-damage-hearts: 0.5
  max-damage-hearts: 5.0

critical:
  require-vanilla-critical-conditions: true

extra-vanilla-protection-scaling:
  enabled: false
  reduction-per-protection-level: 0.02
  max-reduction: 0.3

# Globalny mnoznik wszystkich hitow (na samym koncu formuly).
# 1.0 = wartosci z tabeli 1:1 (ten sam set, klata = 1.778 / 2.107, elytra = 2.54 / 3.01).
global-hits:
  multiplier: 1.0

hit-registration:
  custom-iframes: true

anti-spam:
  enabled: true
  min-interval-ms: 350
  block-mode: cancel
  penalty-percent: 100

gang-up-penalty:
  enabled: true
  penalty-percent: 15
  window-ms: 3000

# Combat-lock: ofiara "nalezy" do ostatniego atakujacego, ktory ja trafil w ciagu
# ostatnich timeout-ms. Jesli w tym oknie zaatakuje ja INNY gracz, jego hit jest
# CALKOWICIE anulowany (0 dmg) - dopiero gdy "wlasciciel" przestanie bic ofiare
# na dluzej niz timeout-ms, kolejny gracz moze przejac lock i normalnie zadawac dmg.
# Zapobiega to stackowaniu obrazen, gdy kilku graczy bije jedna osobe naraz.
combat-lock:
  enabled: true
  timeout-ms: 750

attack-strength-requirement:
  enabled: true
  min-percent: 50
