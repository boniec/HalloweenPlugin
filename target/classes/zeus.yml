# ── Boss: Zeus (MythicMobs) ─────────────────────────────────────────
# Zarzadzanie: /adminzeus <spawn|kill|info|reload|respawn|ustawspawn|top|editdrop>
#
# Boss jest spawnowany jako MythicMob (model/skille/AI definiujesz w
# MythicMobs, w pliku Mobs/*.yml). Ten config odpowiada tylko za HP/respawn/
# bossbar/nagrody - czyli wszystko to, czym zarzadza ten plugin.

settings:
  enabled: true
  nazwa: "&e&lZEUS"
  # Internal Name moba MythicMobs, ktory ma sie spawnowac jako Zeus.
  # Musi dokladnie odpowiadac Internal Name z pliku Mobs/*.yml w MythicMobs.
  mythicmob-id: "MSO_Zeus"
  # Poziom (level) moba przekazywany do MythicMobs przy spawnie.
  mythicmob-level: 1.0
  hp-max: 2000.0
  # Bazowe obrazenia zadawane przez bossa (Bukkit attribute ATTACK_DAMAGE).
  obrazenia: 6.0
  # Realne obrazenia (w HP, 1 serce = 2 HP) zadawane graczowi przez KAZDE
  # uderzenie Zeusa, niezaleznie od jego zbroi/enchantow.
  obrazenia-stale-hp: 6.0
  # Predkosc poruszania sie bossa.
  predkosc: 0.28
  # Czy boss ma glow/blask, zeby latwiej go dostrzec.
  swiecacy: true
  # Czy boss moze sam despawnowac (persistent - zalecane true).
  persistent: true
  # Zasieg (w blokach) specjalnego ataku piorunem Zeusa.
  zasieg-pioruna: 15.0

# ── Respawn ───────────────────────────────────────────────────────────
respawn:
  automatyczny: true
  # Po ilu sekundach od smierci respi sie boss. 28800 = 8 godzin.
  czas-sekund: 28800
  # Czy przy starcie/restarcie serwera boss ma pojawic sie OD RAZU.
  spawn-przy-starcie: false
  # Lokalizacja spawnu bossa. Ustawiana komenda "/adminzeus ustawspawn".
  swiat: ""
  x: 0.0
  y: 0.0
  z: 0.0
  yaw: 0.0

# ── BossBar ───────────────────────────────────────────────────────────
bossbar:
  kolor: YELLOW
  styl: SOLID
  # %hp% - aktualne hp (liczba calkowita)
  # %hpmax% - maksymalne hp
  # %procent% - procent hp
  # %czas% - czas do respawnu (gdy boss jest martwy)
  tytul-zywy: "&e&lZEUS &8[&c%hp%/%hpmax% HP&8]"
  tytul-martwy: "&8Zeus odrodzi się za: &e%czas%"

# ── Wiadomosci ────────────────────────────────────────────────────────
messages:
  prefix: "&8[&e&lBoss&8] "
  spawn: "&eZeus przebudził się i zstąpił z Olimpu!"
  smierc: "&a%zabojca% &7zadal ostateczny cios Zeusowi! Boss zostal pokonany!"
  tytul-smierci-podtytul: "&fZostal pokonany!"
  brak-obrazen-do-nagrod: "&7Nikt nie zadal wystarczajacych obrazen, aby otrzymac nagrode za TOP."
  respawn-wkrotce: "&7Zeus odrodzi sie za &e%czas%&7!"
  nie-mozna-zaatakowac-innego-swiata: "&cNie mozesz zaatakowac Zeusa z innego swiata."

# ── Nagrody za samo uderzenie bossa (wymaga Vault) ──────────────────
nagroda-za-uderzenie:
  wlaczone: true
  cooldown-sekund: 5
  pieniadze-min: 5.0
  pieniadze-max: 15.0
  wiadomosc: "&a+%kwota%$ &7za trafienie Zeusa!"

# ── Nagrody za TOP obrazen zadanych bossowi ──────────────────────────
nagrody-top:
  wlaczone: true
  top-1:
    pieniadze: 2000.0
    komendy:
      - "eco give %gracz% 2000"
    wiadomosc: "&6&l1 MIEJSCE &7w zadanych obrazeniach Zeusowi! &a+2000$"
  top-2:
    pieniadze: 1000.0
    komendy: []
    wiadomosc: "&e&l2 MIEJSCE &7w zadanych obrazeniach Zeusowi! &a+1000$"
  top-3:
    pieniadze: 500.0
    komendy: []
    wiadomosc: "&f&l3 MIEJSCE &7w zadanych obrazeniach Zeusowi! &a+500$"
  ostatni-cios:
    wlaczone: true
    pieniadze: 500.0
    komendy: []
    wiadomosc: "&d&lOSTATNI CIOS &7Zeusowi! &a+500$"

# ── Drop przedmiotow przy TRAFIENIU bossa ────────────────────────────
# Sam drop (itemy + szanse) edytujesz w GUI: /adminzeus editdrop
drop-za-trafienie:
  wlaczone: true
  cooldown-sekund: 1.0

# ── Drop przedmiotow po smierci (opcjonalnie, oprocz pieniedzy) ────────
drop:
  - material: DIAMOND
    ilosc-min: 5
    ilosc-max: 15
    szansa: 100.0
  - material: NETHERITE_INGOT
    ilosc-min: 1
    ilosc-max: 3
    szansa: 35.0
