    - "&f"
    - "&f ꕃ ᴅᴢɪᴇᴋɪ ᴛᴇᴍᴜ &x&E&3&C&9&A&0ʟᴇɢᴇɴᴅᴀʀɴᴇᴍᴜ &fᴘʀᴢᴇᴅᴍɪᴏᴛᴏᴡɪ"
