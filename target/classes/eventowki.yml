# =========================================================
#  EVENTOWKI.YML - Konfiguracja Event Items modułu PoleZamek
#  
#  Tutaj konfigurujemy wszystkie przedmioty eventowe:
#  - Kokos, Lampion, Antycobweb, Olej, Moc Vadera, Moc Yody
#  - Cukierki Luke Skywalkera, Jablko Jedi, Kamien Odrodzenia, Koza, Eventowka losowa
#  - Sakiewka Mandalorianina (eventowka: drop PvP do shulkera)
#  - Kosa Grabazy, Gwozdz Trumny (halloween)
#
#  CustomModelData: kazdy item ma <item>.custom-model-data (0 = brak, zwykly item).
#  Zmiana dziala po /polezamekreload (itemy graczy odswieza sie same).
#
#  Kolory: & kod (np. &a = zielony, &c = czerwony, &x&R&R&G&G&B&B = RGB)
#  Po zmianach: /polezamekreload
# =========================================================

# =========================================================
# KOKOS - Moćny item leczniczy z efektami (jednorazowy)
# =========================================================
kokos:
  # Nazwa przedmiotu (wyświetlana w ekwipunku)
  name: "&fꕃ &f&lᴋᴏᴋᴏꜱ"
  # CustomModelData (0 = brak)
  custom-model-data: 1001

  # Efekty na jedzeniu
  regen-amplifier: 1          # Amplifier regeneracji (0 = regen I, 1 = regen II, etc)
  regen-duration-seconds: 5   # Czas trwania regeneracji

  absorption-amplifier: 1     # Amplifier absorpcji (serca zł)
  absorption-duration-seconds: 120  # Czas trwania absorpcji (2 minuty)

  speed-amplifier: 0          # Amplifier szybkości (0 = speed I, etc)
  speed-duration-seconds: 10  # Czas trwania szybkości

  # Lore (opis przedmiotu - jeśli puste, użyje domyślnego)
