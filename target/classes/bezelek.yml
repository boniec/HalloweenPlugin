# ==========================================================
#   BLOKADA ELYTR NA REGIONIE
#   Gdy gracz probuje uzyc elytry w regionie, elytra jest mu zdejmowana
#   (wraca do ekwipunku), a na elytrze pojawia sie wizualny cooldown.
#   Omijanie blokady: permisja bezelek.elytra.bypass
# ==========================================================

# ID regionu WorldGuard
region: bezelek

# Dlugosc wizualnego cooldownu na elytrze po zdjeciu (20 ticków = 1 sekunda)
