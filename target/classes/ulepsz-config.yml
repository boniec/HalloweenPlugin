# ── System Ulepszeń - Konfiguracja GUI ───────────────────────────────
# Tytuły, tło i teksty lore dla /ulepsz (ikony Nexo: znak wstawiasz po &f).

gui:
  wersja: 6
  # Tło z texture packa (glyph gui_ulepszanie). Puste = domyślne z kodu.
  tytul-glowne: "&f<shift:-8>&f都"
  # %kategoria% = nazwa kategorii w podglądzie poziomów
  tytul-podglad: "&5&lᴘᴏᴢɪᴏᴍʏ &8» &d%kategoria%"

# Tło okna — domyślnie wyłączone (bez szkła / betonu)
tlo:
  wlaczone: false
  wypelnienie: GRAY_STAINED_GLASS_PANE
  ramka: GRAY_STAINED_GLASS_PANE
  akcent: GRAY_STAINED_GLASS_PANE
  # true = automatyczna ramka (góra/dół + boki); false = tylko sloty z listy
  auto-ramka: true
  sloty-akcent:
    - 0
    - 8
    - 45
    - 53

dekoracja:
  yellow:
    slot: [0, 8, 45, 53]
    material: YELLOW_STAINED_GLASS
  orange:
    slot: [1, 7, 9, 17, 44, 52, 36, 46]
    material: ORANGE_STAINED_GLASS
  white:
    slot: [2, 3, 5, 6, 47, 48, 50, 51, 26, 35, 18, 27]
    material: WHITE_STAINED_GLASS

powrot:
  slot: 49
  material: ARROW
  nazwa: "&f並 &5&lᴘᴏᴡʀóᴛ"
  lore:
    - ""
    - "&7Wróć do głównego menu ulepszeń."

lore:
  separator: "&8&m                              "
  nastepne: "&f亞 &7Następne ulepszenie: &f%item%"
  cena: "&f中 &7Cena: %price%"
  klik-lewy: "&a&l▶ &f嗨 &7LPM &8- &a&lulepsz / kup"
  klik-prawy: "&6&l▶ &f七 &7PPM &8- &e&llista poziomów"
  max-status: "&f両 &7Status: &a&lMaksymalny poziom!"
  max-brak: "&f个 &7Następne: &cBrak (max)"
  podglad-cena: "&f中 &7Cena poziomu: %price%"

# Wygląd przedmiotu w menu. Nazwa itemu z /aulepsz add NIE jest nadpisywana.
# %poziom% %price%  |  %enchanty% = linie zaklęć
podglad:
  nazwa: "%nazwa%"
  lore:
    - ""
    - "&f丅 &aPoziom: &f%poziom%"
    - "&f中 &eCena: &a%price%"
    - ""
    - "%enchanty%"
  status-zablokowany: "&c✖ &cNajpierw zdobądź niższe poziomy"
  status-aktualny: "&a✔ &aTwój aktualny poziom"
  status-nastepny: "&e▶ &eKolejne ulepszenie"
  status-posiadany: "&a✔ &aJuż zdobyty"
  status-max: "&a✔ &aMaksymalny poziom"

# TAB / scoreboard: %inventory_ulepsz%  %inventory_miecz%  %inventory_zbroja%
# Poziomy biorą się z /ulepsz (dopasowanie itemu do poziomów z /aulepsz).
placeholder:
  brak: "0"
  miecz: "&e%poziom%"
  zbroja: "&b%poziom%"
  sharpness: "%poziom%"
  protection: "%poziom%"
  linia: "&#B878F8🔥%miecz% &9🛡%zbroja%"

wiadomosci:
  prefix: "&8[&d&lᴜʟᴇᴘꜱᴢ &8] &r"
