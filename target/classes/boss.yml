# ── Boss: Minotaur (Piglin Brute) ────────────────────────────────────
# Zarzadzanie: /adminboss <spawn|kill|info|reload|respawn>

settings:
  enabled: true
  nazwa: '&c&lMinotaur'
  # Typ encji - musi byc PIGLIN_BRUTE zeby wygladal jak minotaur.
  typ: PIGLIN_BRUTE
  hp-max: 4000.0
  # Bazowe obrazenia zadawane przez bossa (Bukkit attribute ATTACK_DAMAGE).
  # UWAGA: to tylko baza do animacji/AI - realne obrazenia zadawane graczowi
  # sa wymuszane na stale w kodzie (patrz "obrazenia-stale-hp" ponizej),
  # zeby zbroja/enchanty gracza nie zmienialy realnego dmg z uderzenia bossa.
  obrazenia: 0.5
  # Realne obrazenia (w HP, 1 serce = 2 HP) zadawane graczowi przez KAZDE
  # uderzenie Minotaura, niezaleznie od jego zbroi/enchantow. 1.5 serca = 3.0.
  obrazenia-stale-hp: 0.7
  # Predkosc poruszania sie bossa.
  predkosc: 0.4
  # Czy boss ma glow/blask, zeby latwiej go dostrzec.
  swiecacy: true
  # Czy boss moze sam despawnowac (persistent - zalecane false).
  persistent: true

# ── Respawn ───────────────────────────────────────────────────────────
respawn:
  # Czy respawnowac automatycznie po smierci.
  automatyczny: true
  # Po ilu sekundach od smierci respi sie boss.
  czas-sekund: 15000
  # Lokalizacja spawnu bossa. Ustawiana automatycznie komenda
  # "/adminboss ustawspawn" (stojac w miejscu, w ktorym ma sie pojawiac).
  swiat: pvp
  x: 151.65321579996362
  y: 25.0
  z: 142.88328017960148
  yaw: -89.17840576171875

# ── BossBar ───────────────────────────────────────────────────────────
bossbar:
  kolor: RED
  styl: SOLID
  # %hp% - aktualne hp (liczba calkowita)
  # %hpmax% - maksymalne hp
  # %procent% - procent hp
  # %czas% - czas do respawnu (gdy boss jest martwy)
  tytul-zywy: '&#E2933A&lᴍ&lɪ&lɴ&lᴏ&#E5A051&lᴛ&#E9AC68&lᴀ&#ECB97E&lᴜ&#EFC595&lʀ &7|
    &c%hp%&8/&c%hpmax% HP &8(&4%procent%%&8)'
  tytul-martwy: '&#E2933A&lᴍ&lɪ&lɴ&lᴏ&#E5A051&lᴛ&#E9AC68&lᴀ&#ECB97E&lᴜ&#EFC595&lʀ
    &7respi sie za: &4%czas%'

# ── Wiadomosci ────────────────────────────────────────────────────────
messages:
  prefix: '&r'
  spawn: '&#E2933A&lᴍ&lɪ&lɴ&lᴏ&#E5A051&lᴛ&#E9AC68&lᴀ&#ECB97E&lᴜ&#EFC595&lʀ &7przebudzil
    sie! Pokonaj go, aby zdobyc nagrody!'
  smierc: '&a%zabojca% &7zadal ostateczny cios Minotaurowi! Boss zostal pokonany!'
  brak-obrazen-do-nagrod: '&7Nikt nie zadal wystarczajacych obrazen, aby otrzymac
    nagrode za TOP.'
  respawn-wkrotce: '&7Minotaur odrodzi sie za &4%czas%&7!'
  nie-mozna-zaatakowac-innego-swiata: '&cNie mozesz zaatakowac Minotaura z innego
    swiata.'

# ── Nagrody za samo uderzenie bossa ─────────────────────────────────
# Wyplacane KAZDEMU graczowi ktory trafi bossa (z cooldownem, zeby nie
# spamowac - patrz "cooldown-sekund" ponizej). Wymaga Vault.
nagroda-za-uderzenie:
  wlaczone: true
  # Cooldown per gracz miedzy wyplatami za samo uderzenie (w sekundach).
  cooldown-sekund: 5
  pieniadze-min: 5.0
  pieniadze-max: 15.0
  wiadomosc: '&a+%kwota%$ &7za trafienie Minotaura!'

# ── Nagrody za TOP obrazen zadanych bossowi (liczone od ostatniego spawnu) ──
nagrody-top:
  wlaczone: true
  top-1:
    pieniadze: 2000.0
    komendy:
      - adminpatron giveodlamek %gracz% 50
    wiadomosc: '&6&l1 MIEJSCE &7w zadanych obrazeniach Minotaurowi! &a+50 Odlamkow'
  top-2:
    pieniadze: 1000.0
    komendy:
      - adminpatron giveodlamek %gracz% 40
    wiadomosc: '&e&l2 MIEJSCE &7w zadanych obrazeniach Minotaurowi! &a+40 Odlamkow'
  top-3:
    pieniadze: 500.0
    komendy:
      - adminpatron giveodlamek %gracz% 30
    wiadomosc: '&f&l3 MIEJSCE &7w zadanych obrazeniach Minotaurowi! &a+30 Odlamkow'
  # Nagroda dla gracza, ktory zadal ostatni (dobijajacy) cios.
  ostatni-cios:
    wlaczone: true
    pieniadze: 2500.0
    komendy: []
    wiadomosc: '&d&lOSTATNI CIOS &7Minotaurowi! &a+2500$'

# ── Drop przedmiotow po smierci (opcjonalnie, oprocz pieniedzy) ────────
# Kazdy wpis to szansa 0-100 na wypadniecie danego przedmiotu w miejscu smierci bossa.
drop:
  - material: DIAMOND
    ilosc-min: 1
    ilosc-max: 15
    szansa: 0.0
  - material: NETHERITE_INGOT
    ilosc-min: 1
    ilosc-max: 3
    szansa: 0.0
