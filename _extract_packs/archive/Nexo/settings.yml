# plugins/Nexo/settings.yml — FlameHub / hosting współdzielony + LobFile

debug: false
ConfigTools:
  generate_default_configs: true
  disable_automatic_model_data: false
  disable_automatic_glyph_code: false
  initial_custom_model_data: 1000
  skipped_model_data_numbers: []
  error_item:
    material: PODZOL
    injectId: false
Furniture:
  remove_invalid_furniture: false
  allowed_gamemodes_for_rotation:
  - SURVIVAL
  - CREATIVE
  invalid_furniture_item:
    material: BARRIER
  anti_cheat:
    spartan_hook: false
    vulcan_hook: false
Recipes:
  require_player_if_permission: true
  keep_track_of_player_furnace: false
  furnace_cooldown_duration: 1s
Plugin:
  keep_this_up_to_date: true
  packets:
    disable_glyph_handler: false
  language: english
  debug: false
  import:
    from_location: []
    from_url: []
  formatting:
    chat_standard_tags: false
    cursor: false
    villagers: true
    packet_events: false
    entity_data: true
    dialog: true
    anvil: true
    books: true
    bossbar: true
    chat: true
    items: true
    scoreboard: true
    signs: true
    tablist: true
    translatable: true

Pack:
  validate:
    models: true
    fonts: true
    atlas: true
    languages: true
  generation:
    generate_pack: true
    output_path: plugins/Nexo/pack/pack.zip
    prefer_item_models: false
    minimize_json: true
    read_lenient: true
    force_oversized_in_gui: false
    excluded_file_extensions:
    - .zip
    - .tar.gz
    packsquash:
      cache_size: 5
      enabled: false
      executable_path: plugins/Nexo/pack/packsquash/packsquash
      settings_path: plugins/Nexo/pack/packsquash/packsquash.toml
  obfuscation:
    type: FULL
    cache: true
  server:
    type: LOBFILE
    lobfile:
      api_key: zJrMeC2PCvFpuBAv
    polymath:
      server: atlas.nexomc.com
      secret: nexomc
    selfhost:
      port: 8082
      public_address: http://127.0.0.1
      dispatch_threads: 10
    s3:
      public_url: https://fsn1.your-objectstorage.com
      region: eu-central-1
      bucket: nexo-storage
      secret_key: SECRET
      access_key: ACCESS
      url_expiration: 7d
  dispatch:
    send_pre_join: true
    send_on_join: false
    send_on_reload: true
    delay: -1
    mandatory: true
    prompt: <#fa4943>Zaakceptuj resource pack, aby grać z custom itemami na <b><gradient:#9055FF:#13E2DA>FlameHub</b><#fa4943>.
  import:
    default_assets: true
    external_packs: true
    from_location: []
    from_url: []
    external_pack_order: []
    model_engine: true

hide_scoreboard_numbers: false
hide_scoreboard_background: false
ItemUpdater:
  update_items: true
  update_items_on_reload: true
  update_tile_entity_contents: true
  update_entity_contents: true
  override_item_lore: false
Misc:
  reset_recipes: true
  add_recipes_to_book: true
  hide_scoreboard_numbers: false
  hide_scoreboard_background: false
  hide_tablist_background: false
  block_other_resourcepacks: false
  default_language_key: en_us
  default_allow_in_vanilla_recipes: false
CustomArmor:
  type: COMPONENT
  auto_assign_settings: true
Glyphs:
  emoji_list_permission_only: true
  unicode_completions: false
  default_permission: nexo.glyphs.<glyphid>
  default_font: nexo:default
  default_shadow_color: '#00000000'
  hover_text: ''
  shift_font: nexo:shift
  generate_gif_shaders: true
WorldEdit:
  fawe_hook: false
  customblock_mechanic: false
  furniture_mechanic: false
