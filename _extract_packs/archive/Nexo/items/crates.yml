# Skrzynie 3D (Chests Pack) - do stawiania jako meble Nexo + klucze
# Modele: plugins/Nexo/pack/assets/chests_pack/models/*.json

crate_normal:
  itemname: '&f&lSkrzynia Zwykła'
  material: PAPER
  Pack:
    model: chests_pack:normal_chest
    custom_model_data: 1000
  Mechanics:
    furniture:
      rotatable: false
      limited_placing:
        roof: false
        floor: true
        wall: false
      restricted_rotation: STRICT
      block_sounds:
        place_sound: block.wood.place
        break_sound: block.wood.break
      hitbox:
        barriers:
        - 0,0,0
      properties:
        display_transform: NONE

