# Skopiuj do plugins/MythicMobs/Mobs/ (wymaga MythicMobs + ModelEngine)
# Spawn: /mm m spawn darth_vader_npc
darth_vader_npc:
  Type: ZOMBIE
  Display: '&8Lord Vader'
  Health: 40
  Damage: 0
  Options:
    Silent: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    MovementSpeed: 0
    KnockbackResistance: 1
    Collidable: false
    AlwaysShowName: false
  AIGoalSelectors:
  - clear
  AITargetSelectors:
  - clear
  Skills:
  - model{mid=darth_vader;step=1;hitbox=true} @self ~onSpawn
  - state{s=idle;li=3;lo=3} @self ~onSpawn
  - cancelEvent @self ~onAttack
